<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>THE SIGNAL — Spotlight Dossier</title>
<style>
  :root {
    --ink: #05070a;
    --ink-raised: #10151d;
    --ink-input: #0d1219;
    --line: #1e2733;
    --text: #d7dde5;
    --text-dim: #7d8998;
    --amber: #ffb020;
    --red: #ff5c5c;
    --blue: #5ac8ff;
    --green: #4fd58a;
    --purple: #c792ea;
    --teal: #2dd4bf;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--ink); }
  body { font-family: var(--font-mono); color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .stage {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(ellipse 120% 90% at 50% 20%, #16202f 0%, #05070a 60%),
      var(--ink);
    -webkit-user-select: none; user-select: none;
  }
  .stage::before {
    content: ""; position: absolute; inset: -20% 0; pointer-events: none; z-index: 30;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    animation: scandrift 9s linear infinite;
  }
  @keyframes scandrift { from { transform: translateY(0); } to { transform: translateY(24px); } }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 31;
    box-shadow: inset 0 0 140px rgba(0,0,0,0.75);
  }

  .progress-bar {
    position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 22;
    display: flex; gap: 4px;
  }
  .seg { flex: 1; height: 3px; background: rgba(255,255,255,0.15); border-radius: 1px; overflow: hidden; }
  .seg-fill { height: 100%; width: 0%; background: var(--amber); box-shadow: 0 0 6px var(--amber); }

  .topbar {
    position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 12px); left: 12px; right: 12px; z-index: 22;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  /* exit-link and stamp are fixed-size chrome; only the case-id block (which
     already wraps its own text to 2 lines) should ever shrink for space —
     without flex-shrink:0 here, a long case-id line squeezes exit-link down
     to a sliver via the flex default instead of wrapping the middle column. */
  .exit-link {
    flex: 0 0 auto;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--line); background: rgba(10,14,20,0.7); padding: 6px 10px; letter-spacing: 0.04em;
    max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .exit-link:hover { color: var(--red); border-color: var(--red); }
  .case-id-wrap { flex: 1 1 auto; min-width: 0; }
  .case-id {
    font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.08em; text-align: center;
    text-transform: uppercase;
  }
  .paused-flag {
    font-size: 9px; color: var(--amber); letter-spacing: 0.1em; margin-top: 3px; opacity: 0;
    text-align: center; transition: opacity 0.2s ease;
  }
  .paused-flag.on { opacity: 1; }
  .stamp {
    flex: 0 0 auto;
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--red);
    border: 2px solid var(--red); padding: 3px 7px; transform: rotate(-6deg); opacity: 0.75;
    text-align: center; line-height: 1.3; white-space: nowrap;
  }

  .slides { position: absolute; inset: 0; z-index: 10; }
  /* .slide is a plain block scroll container — NOT itself a flex box with
     justify-content:center, which combined with overflow:auto makes the
     start of overflowing content unreachable by scroll in most browsers.
     Centering happens on .slide-inner instead, which has no fixed height
     so it simply grows (no centering bug) once content exceeds one screen. */
  .slide {
    position: absolute; inset: 0; display: none;
    padding: 92px 22px 64px; overflow-y: auto;
  }
  .slide.active { display: block; animation: slideIn 0.35s ease; }
  /* Top-aligned, not centered: slide content heights vary a lot (a two-line
     summary vs. a full CVE record with CWEs/vendors/references), and
     vertical centering made the title jump to a different y-position on
     every slide as the block's height changed. Fixing everything to the
     top keeps the title anchored in the same place across the carousel. */
  .slide-inner { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-start; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .section-label {
    font-size: 11px; letter-spacing: 0.14em; color: var(--amber); margin-bottom: 16px; opacity: 0.9;
  }
  .section-label::before { content: "// "; opacity: 0.6; }
  .subhead {
    font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 8px; text-transform: uppercase;
  }

  /* redaction-reveal motif for headline text */
  .redact { position: relative; display: inline-block; }
  .redact::after {
    content: ""; position: absolute; inset: -2px -4px; background: #05070a; transform-origin: right;
  }
  .slide.active .redact::after { animation: declassify 0.55s ease forwards; animation-delay: 0.2s; }
  @keyframes declassify { to { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) {
    .redact::after { transform: scaleX(0); }
  }

  /* --- digest slide-kind labels: the digest mixes feed items, CVEs, APT
     group teasers and ransomware victims in one carousel, so each slide
     needs an immediate, plain-language "what am I looking at" cue. --- */
  .kind-tag {
    display: inline-block; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); padding: 4px 9px; margin-bottom: 10px;
  }
  .kind-tag.feed { background: var(--blue); }
  .kind-tag.cve { background: var(--red); }
  .kind-tag.group { background: var(--purple); }
  .kind-tag.victim { background: var(--teal); }
  .kind-tag.negotiation-group { background: var(--green); }

  .claimed-by {
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--red); background: rgba(255,92,92,0.08);
    color: var(--text); padding: 9px 12px; margin-bottom: 14px; font-size: 13px;
  }
  .claimed-by .cb-icon { color: var(--red); font-size: 15px; flex: 0 0 auto; }
  .claimed-by b { font-family: var(--font-sans); font-weight: 700; }

  /* --- title slide --- */
  .case-number { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 10px; }
  .slide-inner h1 {
    font-family: var(--font-sans); font-size: clamp(28px, 8vw, 44px); margin: 0 0 12px; line-height: 1.1;
    letter-spacing: 0.01em;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tag-chip {
    font-size: 10.5px; color: var(--text-dim); border: 1px solid var(--line); padding: 4px 9px;
    letter-spacing: 0.03em;
  }
  .flag-chip { font-size: 13px; }

  .gauge-wrap { margin: 18px 0 16px; }
  .gauge-label { font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 6px; }
  .gauge-label b { color: var(--gauge-color, var(--amber)); }
  .gauge-track { height: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); position: relative; }
  .gauge-track::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 1px), rgba(255,255,255,0.15) 10%);
  }
  .gauge-fill { height: 100%; width: 0%; background: var(--gauge-color, var(--amber)); box-shadow: 0 0 10px var(--gauge-color, var(--amber)); }
  .gauge-caption { font-size: 9.5px; color: var(--text-dim); margin-top: 6px; opacity: 0.8; }

  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; color: var(--amber);
    border: 1px solid var(--amber); padding: 5px 9px; background: rgba(255,176,32,0.08);
  }

  /* --- origin / profile slide --- */
  .dossier-text {
    font-family: var(--font-sans); font-size: 15px; line-height: 1.7; color: var(--text);
    white-space: pre-line; max-width: 60ch;
  }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .meta-cell { border: 1px solid var(--line); padding: 10px 12px; }
  .meta-cell span { display: block; font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.08em; margin-bottom: 4px; }
  .meta-cell b { font-family: var(--font-sans); font-size: 14px; }

  /* --- coverage / scan slide --- */
  .scan-list { display: flex; flex-direction: column; gap: 4px; }
  .scan-row {
    display: grid; grid-template-columns: 1fr 34px; align-items: center; gap: 10px; font-size: 11px;
    width: 100%; padding: 6px 0;
  }
  button.scan-row {
    background: none; border: none; color: inherit; font-family: inherit; cursor: pointer; text-align: left;
  }
  .scan-row .sname { color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scan-row.hit .sname { color: var(--text); }
  button.scan-row.hit .sname::after { content: " ▾"; color: var(--teal); font-size: 9px; }
  .scan-row .strack { height: 6px; background: rgba(255,255,255,0.06); margin-top: 3px; }
  .scan-row .sfill { height: 100%; width: 0%; background: var(--teal); box-shadow: 0 0 6px var(--teal); transition: width 0.5s ease; }
  .scan-row .scount { text-align: right; color: var(--text-dim); font-size: 10px; }
  .scan-detail { padding: 2px 0 10px 2px; }
  .scan-detail[hidden] { display: none; }

  .chip {
    font-size: 11px; padding: 5px 10px; background: var(--ink-input); border: 1px solid var(--line);
    color: var(--text); text-decoration: none; display: inline-block;
  }
  .chip:hover { border-color: var(--teal); color: var(--teal); }

  /* --- arsenal slide --- */
  .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .asset-card {
    text-align: left; background: var(--ink-raised); border: 1px solid var(--line); border-left: 2px solid var(--purple);
    color: var(--text); font-family: var(--font-mono); padding: 9px 10px; cursor: pointer;
  }
  .asset-card .aid { font-size: 9px; color: var(--text-dim); }
  .asset-card .aname { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .asset-card .adesc { font-size: 10.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.45; display: none; }
  .asset-card.expanded .adesc { display: block; }
  .asset-card.expanded { border-left-color: var(--amber); }
  .zoom-link {
    display: inline-block; margin-top: 8px; font-size: 10px; color: var(--amber); text-decoration: none;
    letter-spacing: 0.04em;
  }
  .zoom-link:hover { text-decoration: underline; }
  .zoom-link.stacked { display: block; }

  /* --- campaigns / timeline slide --- */
  .timeline { position: relative; padding-left: 18px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; }
  .tl-entry { position: relative; }
  .tl-entry::before {
    content: ""; position: absolute; left: -22.5px; top: 3px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 6px var(--red);
  }
  .tl-year { font-size: 10px; color: var(--red); letter-spacing: 0.08em; margin-bottom: 3px; }
  .tl-name { font-family: var(--font-sans); font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .tl-desc { font-size: 12px; color: var(--text-dim); line-height: 1.55; max-width: 56ch; }

  /* --- connections / used-by slide --- */
  .orbit-wrap { position: relative; height: 130px; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; }
  .orbit-center {
    width: 14px; height: 14px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 14px var(--amber); z-index: 1;
  }
  .orbit-ring { position: absolute; inset: 0; animation: spin 16s linear infinite; }
  .orbit-ring.rev { animation-direction: reverse; animation-duration: 22s; }
  .orbit-dot {
    position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue); box-shadow: 0 0 6px var(--blue);
    transform: rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a)));
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .associate-list { display: flex; flex-direction: column; gap: 8px; }
  .associate-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--ink-raised); border: 1px solid var(--line); border-left: 2px solid var(--blue);
    padding: 10px 12px; text-decoration: none; color: var(--text);
  }
  .associate-row:hover { border-left-color: var(--amber); }
  .ar-name { font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; }
  .ar-score { font-size: 10px; color: var(--text-dim); white-space: nowrap; }

  /* --- defense slide --- */
  .counter-list { display: flex; flex-direction: column; gap: 14px; }
  .counter-entry { display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
  .cnum { font-size: 16px; color: var(--green); font-weight: 700; opacity: 0.8; }
  .cname { font-family: var(--font-sans); font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .cdesc { font-size: 11.5px; color: var(--text-dim); line-height: 1.5; max-width: 56ch; }

  /* --- CVE digest slide --- */
  .kev-box { border: 1px solid var(--red); padding: 10px 12px; font-size: 12px; line-height: 1.55; color: var(--text); margin: 14px 0; }
  .kev-box .kb-label { color: var(--red); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; margin-bottom: 6px; }
  .ref-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .ref-list a { color: var(--blue); font-size: 11.5px; word-break: break-all; }

  /* --- nav --- */
  /* purely a visual/documentation region — pointer-events:none so it never
     shadows interactive elements inside the active slide underneath it;
     navigation is decided by tap x-position in the #stage pointer handler */
  .tap-zone { position: absolute; top: 88px; bottom: 96px; z-index: 15; pointer-events: none; }
  .tap-left { left: 0; width: 30%; }
  .tap-right { right: 0; width: 70%; }
  .hint {
    position: absolute; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 56px); left: 0; right: 0; z-index: 22;
    text-align: center; font-size: 10px; color: var(--text-dim); opacity: 0.7; pointer-events: none;
    letter-spacing: 0.04em;
  }

  /* Explicit, persistent pause/resume control — takes precedence over every
     touch/tap gesture (see manualPauseLock in the script). A big, unambiguous
     target for readers who don't want to rely on landing a double-tap. */
  .pause-btn {
    position: absolute; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 24;
    transform: translateX(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(16,21,29,0.92); border: 2px solid var(--amber); color: var(--amber);
    font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 0 16px rgba(255,176,32,0.25);
  }
  .pause-btn:hover { filter: brightness(1.15); }
  .pause-btn.active { border-color: var(--red); color: var(--red); box-shadow: 0 0 16px rgba(255,92,92,0.35); }

  /* Reading-speed control — cycles Normal / Slow / Slowest, adding 5s per
     step to every slide's auto-advance duration. Persisted per-device so a
     reader's chosen pace sticks across visits. */
  .speed-btn {
    position: absolute; right: 14px; bottom: max(18px, calc(env(safe-area-inset-bottom) + 6px)); z-index: 24;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; color: var(--text-dim);
    background: rgba(16,21,29,0.92); border: 1px solid var(--line); padding: 7px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .speed-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .speed-btn.slow { color: var(--blue); border-color: var(--blue); }
  .speed-btn.slowest { color: var(--teal); border-color: var(--teal); }

  .empty-target {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px; z-index: 20;
  }
  .empty-target a { color: var(--amber); }

  /* --- negotiation replay: a scrolling chat log instead of a slide deck.
     Navigation here is browser scroll, not swipe, so tap-zones/hint are
     hidden for this mode via .negotiation-mode on #stage. --- */
  .negotiation-mode .tap-zone, .negotiation-mode .hint { display: none; }
  /* Setting overflow-y without an explicit overflow-x lets the CSS overflow
     spec compute overflow-x as "auto" too (not "visible"), so a bubble with
     one long unbroken token (a hash, a URL) could open up a horizontal
     scrollbar for the whole chat — overflow-x: hidden plus word-break on the
     bubble text closes both ends of that. CONTROL_CLEARANCE_PX in the script
     below must stay in sync with this padding-bottom — it's how far a
     revealed message is kept clear of the pause/speed buttons, which float
     on top of this scroll area rather than taking up their own layout space. */
  .chat-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; z-index: 10; padding: 92px 16px 140px; }
  .chat-msg {
    display: flex; flex-direction: column; max-width: 82%; margin-bottom: 16px;
    opacity: 0; transform: translateY(8px); transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .chat-msg.visible { opacity: 1; transform: translateY(0); }
  .chat-msg.them { align-items: flex-start; margin-right: auto; }
  .chat-msg.victim { align-items: flex-end; margin-left: auto; }
  .chat-bubble {
    padding: 10px 13px; font-size: 13.5px; line-height: 1.55; white-space: pre-line;
    font-family: var(--font-sans); overflow-wrap: anywhere; word-break: break-word;
    border-radius: 16px;
  }
  .chat-msg.them .chat-bubble { background: rgba(255,92,92,0.1); border: 1px solid var(--red); color: var(--text); border-bottom-left-radius: 4px; }
  .chat-msg.victim .chat-bubble { background: rgba(90,200,255,0.1); border: 1px solid var(--blue); color: var(--text); border-bottom-right-radius: 4px; }
  .chat-meta {
    font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); margin-top: 5px;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .chat-end {
    text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.1em; opacity: 0; transition: opacity 0.4s ease; padding: 8px 0 4px;
  }
  .chat-end.visible { opacity: 0.75; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="progress-bar" id="progress-bar"></div>
    <div class="topbar">
      <a class="exit-link no-nav" id="exit-link" href="attack.html">‹ EXIT</a>
      <div class="case-id-wrap">
        <div class="case-id" id="case-id">SIGNAL // SPOTLIGHT</div>
        <div class="paused-flag" id="paused-flag">‖ PAUSED — DOUBLE-TAP TO RESUME</div>
      </div>
      <div class="stamp">CLASSIFIED<br>EYES ONLY</div>
    </div>

    <div class="slides" id="slides"></div>
    <div class="tap-zone tap-left" id="tap-left"></div>
    <div class="tap-zone tap-right" id="tap-right"></div>
    <div class="hint" id="hint">tap right to advance · left to go back · tap an item to inspect</div>
    <button class="pause-btn no-nav control-btn" id="pause-btn" aria-label="Pause auto-advance">‖</button>
    <button class="speed-btn no-nav control-btn" id="speed-btn" aria-label="Reading speed">◷ NORMAL</button>
  </div>

<script>
(() => {
  const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const params = new URLSearchParams(location.search);
  const domain = params.get("domain") || "enterprise";
  let type = params.get("type") || (params.get("group") ? "groups" : null);
  const id = params.get("id") || params.get("group");
  const fromUrl = params.get("from");
  const fromName = params.get("fromName");
  // Digest mode: no specific entity requested (e.g. the plain "Spotlight" button on
  // index.html) — a mixed carousel of recent feed items, severe CVEs, and two full
  // group dossiers, built once in init() and assembled by buildDigestSlides().
  const isNegotiation = params.get("mode") === "negotiation";
  const isDigest = !isNegotiation && (params.get("mode") === "digest" || !id);

  const TYPE_META = {
    groups: { caseLabel: "CASE FILE", pageLabel: "ACTOR" },
    techniques: { caseLabel: "TECHNIQUE FILE", pageLabel: "TECHNIQUE" },
    software: { caseLabel: "ASSET FILE", pageLabel: "ASSET" },
  };
  if (!TYPE_META[type]) type = "groups";

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }
  function flagEmoji(code) {
    if (!code || code.length !== 2) return "🏳";
    return [...code.toUpperCase()].map(c => String.fromCodePoint(127397 + c.charCodeAt(0))).join("");
  }

  function zoomHref(zType, zId, selfLabel) {
    const p = new URLSearchParams();
    p.set("domain", domain);
    p.set("type", zType);
    p.set("id", zId);
    p.set("from", location.pathname + location.search);
    p.set("fromName", selfLabel);
    return "spotlight.html?" + p.toString();
  }

  function showEmptyTarget(message, backHref, backLabel) {
    document.getElementById("stage").innerHTML = `
      <div class="empty-target">
        <div class="stamp" style="transform:rotate(-4deg)">NO TARGET<br>SELECTED</div>
        <div style="color:var(--text-dim); font-size:13px; max-width:40ch;">${escapeHtml(message)}</div>

  function percentile(arr, p) {
    const s = [...arr].sort((a, b) => a - b);
    if (!s.length) return 0;
    return s[Math.min(s.length - 1, Math.floor(s.length * p))];
  }

  function computeAssessment(group, data) {
    const techCounts = data.groups.map(g => g.techniques.length);
    const softCounts = data.groups.map(g => g.software.length);
    const techMax = Math.max(1, ...techCounts);
    const tacticsTouched = new Set(group.techniques.flatMap(tid => data.byId.techniques[tid]?.tactics || []));
    const coveragePct = data.tactics.length ? (tacticsTouched.size / data.tactics.length) * 100 : 0;
    const techPct = (group.techniques.length / techMax) * 100;
    const score = Math.round((techPct + coveragePct) / 2);

    let level, color;
    if (score >= 75) { level = "CRITICAL"; color = "var(--red)"; }
    else if (score >= 50) { level = "HIGH"; color = "var(--amber)"; }
    else if (score >= 25) { level = "MODERATE"; color = "var(--teal)"; }
    else { level = "LOW"; color = "var(--text-dim)"; }

    const techP75 = percentile(techCounts, 0.75);
    const softP75 = percentile(softCounts, 0.75);
    const badges = [];
    if (group.countries.length) badges.push("STATE-LINKED");
    if (coveragePct >= 80) badges.push("FULL SPECTRUM");
    if (techP75 > 0 && group.techniques.length >= techP75) badges.push("PROLIFIC OPERATOR");
    if (softP75 > 0 && group.software.length >= softP75) badges.push("HEAVY ARSENAL");
    if (group.campaigns.length >= 2) badges.push("ACTIVE CAMPAIGNS");
    if (!badges.length) badges.push("LOW PROFILE");

    return { score, level, color, coveragePct, tacticsTouched, badges };
  }

  function relatedGroups(group, data, limit = 6) {
    const mySoft = new Set(group.software);
    const myTech = new Set(group.techniques);
    return data.groups
      .filter(g => g.id !== group.id)
      .map(g => {
        const softOverlap = g.software.filter(id => mySoft.has(id)).length;
        const techOverlap = g.techniques.filter(id => myTech.has(id)).length;
        return { g, score: softOverlap * 3 + techOverlap };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, limit);
  }

  function mitigationsFor(techniqueIds, data, limit = 10) {
    const freq = {};
    techniqueIds.forEach(tid => {
      (data.byId.techniques[tid]?.mitigations || []).forEach(mid => { freq[mid] = (freq[mid] || 0) + 1; });
    });
    return Object.entries(freq)
      .sort((a, b) => b[1] - a[1])
      .slice(0, limit)
      .map(([mid]) => data.byId.mitigations[mid])
      .filter(Boolean);
  }

  function coverageSlide(g, data, selfLabel) {
    const rows = data.tactics.map(t => {
      const techs = g.techniques.map(tid => data.byId.techniques[tid]).filter(t2 => t2 && t2.tactics.includes(t.id));
      return { t, techs };
    });
    const max = Math.max(1, ...rows.map(r => r.techs.length));
    return {
      key: "coverage", duration: 6500,
      html: `
        <div class="section-label">Kill-Chain Scan</div>
        <div class="scan-list">
          ${rows.map(({ t, techs }, i) => {
            const pct = techs.length ? (techs.length / max * 100).toFixed(0) : 0;
            const rowTag = techs.length ? "button" : "div";
            const rowHtml = `
              <${rowTag} class="scan-row ${techs.length ? "hit no-nav" : ""}" data-i="${i}" data-pct="${pct}">
                <div>
                  <div class="sname">${escapeHtml(t.name)}</div>
                  <div class="strack"><div class="sfill"></div></div>
                </div>
                <div class="scount">${techs.length || "—"}</div>
              </${rowTag}>`;
            const detailHtml = techs.length ? `
              <div class="scan-detail" data-i="${i}" hidden>
                <div class="chip-row">
                  ${techs.map(tq => `<a class="chip no-nav" href="${zoomHref("techniques", tq.id, selfLabel)}">${escapeHtml(techniqueLabel(tq, data))}</a>`).join("")}
                </div>
              </div>` : "";
            return rowHtml + detailHtml;
          }).join("")}
        </div>
      `,
      onMount(el) {
        const rowsEl = [...el.querySelectorAll(".scan-row")];
        rowsEl.forEach((row, i) => {
          const fill = row.querySelector(".sfill");
          const pct = row.dataset.pct;
          if (REDUCED_MOTION) { fill.style.width = pct + "%"; return; }
          setTimeout(() => { fill.style.width = pct + "%"; }, 60 * i);
        });
        el.querySelectorAll("button.scan-row").forEach(row => {
          row.addEventListener("click", (e) => {
            e.stopPropagation();
            const i = row.dataset.i;
            const detail = el.querySelector(`.scan-detail[data-i="${i}"]`);
            const willOpen = detail.hidden;
            el.querySelectorAll(".scan-detail").forEach(d => { d.hidden = true; });

  function negotiationSpotlightHref(g, chatUrl, label) {

  // ---------- per-type slide-deck assembly ----------

  function buildGroupSlides(g, data, selfLabel) {
    const assessment = computeAssessment(g, data);
    const related = relatedGroups(g, data);
    const mitigations = mitigationsFor(g.techniques, data);

    const list = [titleSlide(g, data, assessment), originSlide(g), coverageSlide(g, data, selfLabel)];
    if (g.software.length) list.push(arsenalSlide(g, data, selfLabel));
    if (g.campaigns.length) list.push(campaignsSlide(g.campaigns.map(id => data.byId.campaigns[id]).filter(Boolean)));
    if (related.length) list.push(connectionsSlide(related, selfLabel));
    if (mitigations.length) list.push(defenseSlide(mitigations));
    return list;
  }

  function buildTechniqueSlides(t, data, selfLabel) {
    const list = [techniqueTitleSlide(t, data), profileSlide(t, "Technique Profile")];
    const groupsList = t.groups.map(id => data.byId.groups[id]).filter(Boolean);
    const softwareList = t.software.map(id => data.byId.software[id]).filter(Boolean);
    if (groupsList.length || softwareList.length) list.push(crossRefSlide(groupsList, softwareList, [], data, selfLabel));
    const campaignsList = (t.campaigns || []).map(id => data.byId.campaigns[id]).filter(Boolean);
    if (campaignsList.length) list.push(campaignsSlide(campaignsList));
    const mitigations = (t.mitigations || []).map(id => data.byId.mitigations[id]).filter(Boolean);
    if (mitigations.length) list.push(defenseSlide(mitigations));
    return list;
  }

  function buildSoftwareSlides(s, data, selfLabel) {
    const list = [softwareTitleSlide(s), profileSlide(s, "Asset Profile")];
    const groupsList = groupsUsingSoftware(s, data);
    const techniquesList = s.techniques.map(id => data.byId.techniques[id]).filter(Boolean);
    if (groupsList.length || techniquesList.length) list.push(crossRefSlide(groupsList, [], techniquesList, data, selfLabel));
    const campaignsList = (s.campaigns || []).map(id => data.byId.campaigns[id]).filter(Boolean);
    if (campaignsList.length) list.push(campaignsSlide(campaignsList));
    return list;
  }

  function buildDigestSlides(threats, cves, attackData, groupIds, leaktracker, leaktrackerGroups, negotiationGroupNames) {
    const feedSlides = (threats.entries || []).slice(0, 5).map(feedItemSlide);
    const cveSlides = (cves.cves || []).slice(0, 10).map(cveDetailSlide);
    const groupSlides = groupIds
      .map(gid => attackData.byId.groups[gid])
      .filter(Boolean)
      .map(groupTeaserSlide);
    const victimSlides = (leaktracker.victims || []).slice(0, 5).map(victimTeaserSlide);
    const negotiationSlides = negotiationGroupNames
      .map(name => (leaktrackerGroups.groups || []).find(g => g.name === name))
      .filter(Boolean)
      .map(negotiationGroupTeaserSlide);
    return [...feedSlides, ...cveSlides, ...groupSlides, ...victimSlides, ...negotiationSlides];
  }

  // ---------- engine ----------

  let slides = [];
  let idx = 0;
  let timerRAF = null;
  let timerStart = 0;
  let timerDuration = 0;
  let isPaused = false;
  let pauseBegan = 0;
  let interactionPaused = false;
  let pendingNavTimer = null;
  // manualPauseLock is the explicit pause/resume button's state. It takes
  // precedence over every touch/tap control: while engaged, resumeTimer()
  // refuses to run (so double-tap and swipe can't silently undo it), and a
  // freshly-entered slide starts paused instead of auto-running. Only the
  // button itself (toggleManualPause) can clear it. Built for readers who
  // can't reliably land a double-tap and need a deliberate, persistent control.
  let manualPauseLock = false;

  const SPEED_KEY = "signal-spotlight-speed";
  const SPEED_ORDER = ["normal", "slow", "slowest"];
  const SPEED_OFFSET_MS = { normal: 0, slow: 5000, slowest: 10000 };
  const SPEED_LABEL = { normal: "NORMAL", slow: "SLOW", slowest: "SLOWEST" };
  let speedMode = SPEED_ORDER.includes(localStorage.getItem(SPEED_KEY)) ? localStorage.getItem(SPEED_KEY) : "normal";

  function speedOffset() { return SPEED_OFFSET_MS[speedMode] || 0; }

  function updateSpeedButton() {
    const btn = document.getElementById("speed-btn");
    btn.textContent = `◷ ${SPEED_LABEL[speedMode]}`;
    btn.className = `speed-btn no-nav control-btn ${speedMode !== "normal" ? speedMode : ""}`;
  }

  function cycleSpeed() {
    speedMode = SPEED_ORDER[(SPEED_ORDER.indexOf(speedMode) + 1) % SPEED_ORDER.length];
    localStorage.setItem(SPEED_KEY, speedMode);
    updateSpeedButton();
    // Apply immediately to the slide already on screen, not just future ones —
    // extending timerDuration just makes the current countdown take longer to
    // fill, since it's still measured from the same timerStart.
    if (slides[idx]) timerDuration = slides[idx].duration + speedOffset();
  }

  function updateStatusUI() {
    const flag = document.getElementById("paused-flag");
    const btn = document.getElementById("pause-btn");
    flag.classList.toggle("on", manualPauseLock || interactionPaused);
    flag.textContent = manualPauseLock ? "‖ PAUSED — TAP ▶ TO RESUME" : "‖ PAUSED — DOUBLE-TAP TO RESUME";
    btn.textContent = manualPauseLock ? "▶" : "‖";
    btn.setAttribute("aria-label", manualPauseLock ? "Resume auto-advance" : "Pause auto-advance");
    btn.classList.toggle("active", manualPauseLock);
  }

  function toggleManualPause() {
    if (manualPauseLock) {
      manualPauseLock = false;
      resumeTimer();
    } else {
      manualPauseLock = true;
      interactionPaused = false;
      if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
      pauseTimer();
    }
    updateStatusUI();
  }

  function renderChrome() {
    document.getElementById("case-id").textContent = isDigest
      ? "SIGNAL // SPOTLIGHT // DIGEST"
      : `SIGNAL // SPOTLIGHT // ${TYPE_META[type].pageLabel} // ${domain.toUpperCase()}`;
    document.getElementById("progress-bar").innerHTML = slides.map(() => `<div class="seg"><div class="seg-fill"></div></div>`).join("");
  }

  function renderSlides() {
    const root = document.getElementById("slides");
    root.innerHTML = slides.map((s, i) => `
      <div class="slide" data-i="${i}" data-key="${s.key}">
        <div class="slide-inner">${s.html}</div>
      </div>`).join("");
    slides.forEach((s, i) => {
      if (s.onMount) s.onMount(root.querySelector(`.slide[data-i="${i}"]`));
    });
  }

  function segFills() { return [...document.querySelectorAll(".seg-fill")]; }

  function setSegProgress(i, pct) {
    const fills = segFills();
    if (fills[i]) fills[i].style.width = pct + "%";
  }

  function syncSegsForIndex(i) {
    segFills().forEach((fill, si) => { fill.style.width = si < i ? "100%" : si > i ? "0%" : fill.style.width; });
  }

  function cancelTimer() {
    if (timerRAF) cancelAnimationFrame(timerRAF);
    timerRAF = null;
  }

  function startTimer(duration) {
    cancelTimer();
    timerDuration = duration;
    timerStart = performance.now();
    // A manual pause persists across navigation — a slide reached while paused
    // starts paused too, rather than silently resuming autoplay behind the reader.
    isPaused = manualPauseLock;
    if (isPaused) pauseBegan = timerStart;
    updateStatusUI();
    if (REDUCED_MOTION) { setSegProgress(idx, manualPauseLock ? 0 : 100); return; }
    setSegProgress(idx, 0);
    tick();
  }

  function tick() {
    if (!isPaused) {
      const elapsed = performance.now() - timerStart;
      const frac = Math.min(1, elapsed / timerDuration);
      setSegProgress(idx, frac * 100);
      if (frac >= 1) { timerRAF = null; next(true); return; }
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function pauseTimer() { if (!isPaused) { isPaused = true; pauseBegan = performance.now(); } updateStatusUI(); }
  function resumeTimer() {
    if (manualPauseLock) return; // locked — only the pause/resume button can clear this
    if (isPaused) { isPaused = false; timerStart += performance.now() - pauseBegan; }
    updateStatusUI();
  }

  function goTo(i) {
    if (i < 0 || i >= slides.length) return;
    const root = document.getElementById("slides");
    root.querySelectorAll(".slide").forEach(el => el.classList.remove("active"));
    idx = i;
    root.querySelector(`.slide[data-i="${i}"]`).classList.add("active");
    syncSegsForIndex(i);
    interactionPaused = false;
    if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
    startTimer(slides[i].duration + speedOffset());
  }

  function next() {
    // The carousel loops indefinitely — past the last slide it wraps back to the first,
    // whether that's a single-entity dossier or the mixed digest.
    goTo(idx < slides.length - 1 ? idx + 1 : 0);
  }
  function prev() { goTo(idx > 0 ? idx - 1 : slides.length - 1); }

  function setupInput() {
    const stage = document.getElementById("stage");
    let downAt = null, downX = 0, downY = 0, moved = false, downOnNoNav = false;
    let lastTapAt = 0;
    let suppressNextClick = false;
    const DOUBLE_TAP_MS = 340;

    document.getElementById("pause-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleManualPause();
    });

    document.getElementById("speed-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      cycleSpeed();
    });
    updateSpeedButton();

    // Capture phase so this runs before a link's own navigation (or an
    // asset-card's own click-to-expand handler) fires.
    stage.addEventListener("click", (e) => {
      if (suppressNextClick) {
        e.preventDefault();
        e.stopPropagation();
        suppressNextClick = false;
      }
    }, true);

    function performNav(clientX) {
      const w = window.innerWidth;
      if (clientX < w * 0.3) prev(); else next();
    }

    // A swipe always navigates, even if it starts on a card or link — a card-dense
    // slide (Arsenal, Connections) must never trap the user with no way to move on.
    //
    // A short tap on an interactive element (.no-nav) pauses the auto-advance timer
    // and KEEPS it paused — it does not resume on its own. Only a double-tap resumes
    // it (continuing the current slide's countdown toward the next slide). A single
    // background tap while paused this way is held for one double-tap window before
    // falling through to normal prev/next, so the two gestures don't collide.
    stage.addEventListener("pointerdown", (e) => {
      // The pause and speed buttons fully own their own click behavior (including
      // managing pause state themselves) — they must never enter the generic
      // swipe/tap tracking below, or a tap on them would also trip the "tapped a
      // .no-nav element" pause-until-double-tap path as an unrelated side effect.
      if (e.target.closest(".control-btn")) return;
      // Starting a drag on top of a real <a> would otherwise trigger the browser's
      // native "drag this link" gesture instead of our pointermove tracking, which
      // silently swallows a swipe that happens to start on a link-heavy slide (e.g.
      // Connections). preventDefault here suppresses only that native drag — the
      // link's own click-driven navigation on release is unaffected.
      if (e.target.closest("a")) e.preventDefault();
      downAt = performance.now(); downX = e.clientX; downY = e.clientY; moved = false;
      downOnNoNav = !!e.target.closest(".no-nav");
      pauseTimer();
    });
    stage.addEventListener("pointermove", (e) => {
      if (downAt == null) return;
      if (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10) moved = true;
    });
    stage.addEventListener("pointerup", (e) => {
      if (downAt == null) return;
      const heldMs = performance.now() - downAt;
      const dx = e.clientX - downX;
      const wasOnNoNav = downOnNoNav;
      downAt = null;

      if (moved && Math.abs(dx) > 60) {
        // A drag that starts AND ends over the same <a> (a wide row like an
        // associate-row spans most of the slide width) still fires a native
        // click on release regardless of distance traveled — unlike touch,
        // mouse click-detection doesn't care how far you moved in between.
        // Since we've already treated this as a swipe, suppress that click.
        suppressNextClick = true;
        interactionPaused = false;
        if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
        resumeTimer();
        if (dx < 0) next(); else prev();
        return;
      }

      if (heldMs < 250 && !moved) {
        const now = performance.now();
        const isDoubleTap = (now - lastTapAt) < DOUBLE_TAP_MS;
        lastTapAt = isDoubleTap ? 0 : now;

        if (isDoubleTap && interactionPaused) {
          if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
          interactionPaused = false;
          resumeTimer();
          return;
        }

        if (wasOnNoNav) {
          interactionPaused = true;
          pauseTimer();
          return;
        }

        if (interactionPaused) {
          if (pendingNavTimer) clearTimeout(pendingNavTimer);
          const clientX = e.clientX;
          pendingNavTimer = setTimeout(() => { pendingNavTimer = null; performNav(clientX); }, DOUBLE_TAP_MS);
          return;
        }

        performNav(e.clientX);
        return;
      }
      resumeTimer();
    });
    stage.addEventListener("pointercancel", () => { downAt = null; resumeTimer(); });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") next();
      else if (e.key === "ArrowLeft") prev();
      else if (e.key === "Escape") { const el = document.getElementById("exit-link"); if (el) location.href = el.href; }
    });
  }

  function setupBackLink() {
    const el = document.getElementById("exit-link");
    if (fromUrl) { el.href = fromUrl; el.textContent = `‹ ${fromName || "back"}`; }
    else if (isDigest) { el.href = "index.html"; el.textContent = "‹ EXIT"; }
    else { el.href = "attack.html"; el.textContent = "‹ EXIT"; }
  }

  const DIGEST_GROUP_COUNT = 3;
  const DIGEST_NEGOTIATION_GROUP_COUNT = 3;

  async function loadDigestData() {
    const [attackR, threatsR, cveR, leaktrackerR, leaktrackerGroupsR] = await Promise.allSettled(
      [loadDomain(), loadThreats(), loadCveLatest(), loadLeaktrackerLatest(), loadLeaktrackerGroups()]
    );
    if (attackR.status === "rejected") console.error("digest: ATT&CK data failed to load", attackR.reason);
    if (threatsR.status === "rejected") console.error("digest: feed data failed to load", threatsR.reason);
    if (cveR.status === "rejected") console.error("digest: CVE data failed to load", cveR.reason);
    if (leaktrackerR.status === "rejected") console.error("digest: leak-tracker data failed to load", leaktrackerR.reason);
    if (leaktrackerGroupsR.status === "rejected") console.error("digest: leak-tracker groups failed to load", leaktrackerGroupsR.reason);
    return {
      attackData: attackR.status === "fulfilled" ? attackR.value : null,
      threats: threatsR.status === "fulfilled" ? threatsR.value : { entries: [] },
      cves: cveR.status === "fulfilled" ? cveR.value : { cves: [] },
      leaktracker: leaktrackerR.status === "fulfilled" ? leaktrackerR.value : { victims: [] },
      leaktrackerGroups: leaktrackerGroupsR.status === "fulfilled" ? leaktrackerGroupsR.value : { groups: [] },
    };
  }

  async function initDigest() {
    const { attackData, threats, cves, leaktracker, leaktrackerGroups } = await loadDigestData();

    const validGroupIds = attackData ? attackData.groups.map(g => g.id) : [];
    let groupIds = (params.get("groups") || "").split(",").map(s => s.trim()).filter(gid => validGroupIds.includes(gid));

    const validNegotiationNames = (leaktrackerGroups.groups || []).filter(g => g.negotiation && g.negotiation.available).map(g => g.name);
    let negotiationGroupNames = (params.get("negoGroups") || "").split(",").map(s => s.trim()).filter(n => validNegotiationNames.includes(n));

    // No (valid) group set pinned in the URL yet — pick DIGEST_GROUP_COUNT at
    // random and bake them into the URL via replaceState, so reloading or
    // backing out of a zoomed-in sub-entity returns to this *same* set rather
    // than a fresh roll.
    let pinUrl = false;
    if (groupIds.length < DIGEST_GROUP_COUNT && validGroupIds.length >= DIGEST_GROUP_COUNT) {
      const pool = [...validGroupIds];
      groupIds = [];
      while (groupIds.length < DIGEST_GROUP_COUNT && pool.length) {
        groupIds.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      pinUrl = true;
    }
    if (negotiationGroupNames.length < DIGEST_NEGOTIATION_GROUP_COUNT && validNegotiationNames.length >= DIGEST_NEGOTIATION_GROUP_COUNT) {
      const pool = [...validNegotiationNames];
      negotiationGroupNames = [];
      while (negotiationGroupNames.length < DIGEST_NEGOTIATION_GROUP_COUNT && pool.length) {
        negotiationGroupNames.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      pinUrl = true;
    } else if (negotiationGroupNames.length === 0 && validNegotiationNames.length) {
      // Fewer matched groups than DIGEST_NEGOTIATION_GROUP_COUNT overall —
      // still show whatever's available rather than nothing.
      negotiationGroupNames = validNegotiationNames;
      pinUrl = true;
    }
    if (pinUrl) {
      const p = new URLSearchParams(location.search);
      p.set("mode", "digest");
      p.set("domain", domain);
      p.set("groups", groupIds.join(","));
      p.set("negoGroups", negotiationGroupNames.join(","));
      history.replaceState(null, "", `spotlight.html?${p.toString()}`);
    }

    slides = buildDigestSlides(threats, cves, attackData || { byId: { groups: {} } }, groupIds, leaktracker, leaktrackerGroups, negotiationGroupNames);
    if (slides.length === 0) {
      showEmptyTarget("No feed, CVE, ATT&CK, or leak-tracker data available yet — have the fetch scripts been run?");
      return;
    }

    setupBackLink();
    renderChrome();
    renderSlides();
    setupInput();
    goTo(0);
  }

  // ---------- negotiation replay: a leaked ransom-chat transcript played
  // back as speech bubbles instead of a slide deck. Reuses the shared
  // pause/speed engine (manualPauseLock, speedOffset, isPaused/timerStart)
  // so the same controls that pace the digest also pace this, but drives
  // its own reveal loop (revealUpTo) since "advance" here means "reveal the
  // next message", not "swipe to the next slide" — the whole transcript is
  // fetched and rendered up front, and messages are just faded in in order. ----------

  const NEGOTIATION_URL_PREFIX = "https://raw.githubusercontent.com/Casualtek/Ransomchats/";
  // Must match .chat-scroll's padding-bottom in the CSS above — how far a
  // freshly-revealed message is kept clear of the pause/speed buttons, which
  // float on top of the scroll area rather than reserving their own space.
  const CONTROL_CLEARANCE_PX = 140;
  let negoMessages = [];
  let negoRevealed = 0;
  // Whether auto-reveal should keep scrolling the transcript to follow the
  // newest message — true until the reader deliberately scrolls away from
  // the current frontier to read back, and re-armed by the resume button.
  let negoFollowing = true;
  // A smooth scrollTo() we trigger ourselves still fires a stream of native
  // 'scroll' events while it animates, each with a scrollTop that hasn't
  // reached the target yet — treating those as "the reader scrolled away"
  // would cancel following on literally every auto-scroll. This is a
  // deadline (performance.now()-based), not a boolean, so a second
  // auto-scroll fired before the first settles doesn't get its own window
  // closed early by the first one's cleanup.
  let negoProgrammaticScrollUntil = 0;

  function cleanChatContent(raw) {
    return (raw || "").trim().replace(/^>\s?/, "");
  }

  function negoMessageDuration(content) {
    const words = (content || "").split(/\s+/).filter(Boolean).length;
    return Math.max(1800, Math.min(7000, 900 + words * 160));
  }

  function renderNegotiationChrome(groupName, label) {
    document.getElementById("case-id").textContent = `SIGNAL // NEGOTIATION // ${escapeHtml(groupName).toUpperCase()} // ${label}`;
    document.querySelector(".stamp").innerHTML = "LEAKED<br>TRANSCRIPT";
    document.getElementById("progress-bar").innerHTML = `<div class="seg"><div class="seg-fill" id="nego-progress-fill"></div></div>`;
    document.getElementById("stage").classList.add("negotiation-mode");
  }

  function renderNegotiationMessages() {
    document.getElementById("slides").innerHTML = `
      <div class="chat-scroll" id="chat-scroll">
        ${negoMessages.map((m, i) => `
          <div class="chat-msg ${m.party}" data-i="${i}">
            <div class="chat-bubble">${escapeHtml(m.content)}</div>
            <div class="chat-meta">${escapeHtml(m.partyLabel)}</div>
          </div>
        `).join("")}
        <div class="chat-end" id="chat-end">— end of transcript —</div>
      </div>`;
  }

  function setNegoProgress(pct) {
    const fill = document.getElementById("nego-progress-fill");
    if (fill) fill.style.width = pct + "%";
  }

  // The scroll target that keeps the last REVEALED message clear of the
  // floating controls. Deliberately not based on root.scrollHeight/clientHeight
  // alone — every message (including ones not revealed yet) is already in the
  // DOM with real layout height so "scroll ahead" has something to scroll
  // into, which means scrollHeight reflects the *whole* transcript from the
  // first render, not just what's currently visible. Anchoring on the last
  // revealed element's own position instead keeps this correct regardless of
  // how much still-invisible content sits below it.
  function frontierScrollTarget() {
    const root = document.getElementById("chat-scroll");
    const lastEl = root.querySelector(`.chat-msg[data-i="${negoRevealed - 1}"]`);
    if (!lastEl) return 0;
    const raw = lastEl.offsetTop + lastEl.offsetHeight - root.clientHeight + CONTROL_CLEARANCE_PX;
    return Math.max(0, Math.min(raw, root.scrollHeight - root.clientHeight));
  }

  function scrollToFrontier(smooth) {
    const root = document.getElementById("chat-scroll");
    const useSmooth = smooth && !REDUCED_MOTION;
    // Generous window for a smooth scroll to settle — it only ever needs to
    // cover a message or two's worth of distance, never the whole transcript.
    negoProgrammaticScrollUntil = performance.now() + (useSmooth ? 700 : 50);
    root.scrollTo({ top: frontierScrollTarget(), behavior: useSmooth ? "smooth" : "auto" });
  }

  function revealUpTo(n) {
    n = Math.min(n, negoMessages.length);
    if (n <= negoRevealed) return;
    const root = document.getElementById("chat-scroll");
    for (let i = negoRevealed; i < n; i++) {
      const el = root.querySelector(`.chat-msg[data-i="${i}"]`);
      if (el) el.classList.add("visible");
    }
    negoRevealed = n;
    setNegoProgress((negoRevealed / negoMessages.length) * 100);
    if (negoRevealed >= negoMessages.length) {
      document.getElementById("chat-end").classList.add("visible");
    }
    if (negoFollowing) scrollToFrontier(true);
  }

  function cancelNegoTimer() { if (timerRAF) cancelAnimationFrame(timerRAF); timerRAF = null; }

  function startNegoMessageTimer() {
    cancelNegoTimer();
    if (negoRevealed >= negoMessages.length) return;
    if (REDUCED_MOTION) { revealUpTo(negoMessages.length); return; }
    timerDuration = negoMessageDuration(negoMessages[negoRevealed].content) + speedOffset();
    timerStart = performance.now();
    isPaused = manualPauseLock;
    if (isPaused) pauseBegan = timerStart;
    updateStatusUI();
    negoTick();
  }

  function negoTick() {
    if (negoRevealed >= negoMessages.length) { timerRAF = null; return; }
    if (!isPaused) {
      const elapsed = performance.now() - timerStart;
      if (elapsed >= timerDuration) {
        revealUpTo(negoRevealed + 1);
        timerRAF = null;
        startNegoMessageTimer();
        return;
      }
    }
    timerRAF = requestAnimationFrame(negoTick);
  }

  function setupNegotiationInput() {
    document.getElementById("pause-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      const wasPaused = manualPauseLock;
      toggleManualPause();
      // Resuming re-arms auto-scroll and snaps straight back to the current
      // frontier — a paused reader may have scrolled off anywhere to read
      // back, and resume should pick up the reveal where it left off, in view,
      // not silently keep revealing off-screen until they scroll down again.
      if (wasPaused) { negoFollowing = true; scrollToFrontier(true); }
    });
    document.getElementById("speed-btn").addEventListener("click", (e) => { e.stopPropagation(); cycleSpeed(); });
    updateSpeedButton();

    const root = document.getElementById("chat-scroll");
    root.addEventListener("scroll", () => {
      // Ignore scroll events fired by our own in-flight auto-scroll — a smooth
      // scrollTo() reports intermediate scrollTop values on every frame while
      // it animates, which would otherwise read as "the reader scrolled away"
      // on essentially every single auto-reveal.
      if (performance.now() < negoProgrammaticScrollUntil) return;

      // "Following" means the reader is sitting at the current frontier —
      // compare against that message's own scroll position, not against
      // root.scrollHeight, which already includes not-yet-revealed messages'
      // reserved (but invisible) height and would never read as "near bottom".
      negoFollowing = Math.abs(root.scrollTop - frontierScrollTarget()) < 48;

      // Scrolling past the reveal frontier (deliberately reading ahead) should
      // just show those messages immediately, rather than leaving blank gaps —
      // and playback, once resumed, continues from wherever that landed instead
      // of replaying from the old position.
      let revealTo = negoRevealed;
      const scrollBottom = root.scrollTop + root.clientHeight;
      root.querySelectorAll(".chat-msg:not(.visible)").forEach(el => {
        if (el.offsetTop < scrollBottom + 40) {
          revealTo = Math.max(revealTo, parseInt(el.dataset.i, 10) + 1);
        }
      });
      if (revealTo > negoRevealed) {
        const wasFollowing = negoFollowing;
        negoFollowing = false; // don't fight a manual upward/ahead scroll with an auto-scroll
        revealUpTo(revealTo);
        negoFollowing = wasFollowing;
        if (!isPaused) startNegoMessageTimer();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { const el = document.getElementById("exit-link"); if (el) location.href = el.href; }
    });
  }

  async function initNegotiation() {
    const chatUrl = params.get("chat") || "";
    const groupName = params.get("group") || "Unknown group";
    const rawLabel = params.get("label") || "latest";
    const label = rawLabel === "longest" ? "LONGEST TRANSCRIPT"
      : rawLabel === "latest" ? "LATEST TRANSCRIPT"
      : `TRANSCRIPT · ${rawLabel.toUpperCase()}`;
    const backHref = `leaktracker.html?group=${encodeURIComponent(groupName)}`;

    setupBackLink();
    renderNegotiationChrome(groupName, label);

    // The chat URL arrives via a query param — only ever fetch it if it's
    // actually pointing at the trusted Ransomchats archive, not wherever a
    // tampered link might point.
    if (!chatUrl.startsWith(NEGOTIATION_URL_PREFIX)) {
      showEmptyTarget("This negotiation link isn't from a trusted source, so it wasn't loaded.", backHref, groupName);
      return;
    }

    let chat;
    try {
      const res = await fetch(chatUrl, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      chat = await res.json();
    } catch (err) {
      showEmptyTarget("Couldn't load this negotiation transcript.", backHref, groupName);
      console.error(err);
      return;
    }

    negoMessages = (chat.messages || [])
      .map(m => {
        const isVictim = (m.party || "").trim().toLowerCase() === "victim";
        return {
          party: isVictim ? "victim" : "them",
          partyLabel: m.party || (isVictim ? "Victim" : groupName),
          content: cleanChatContent(m.content),
        };
      })
      .filter(m => m.content);

    if (negoMessages.length === 0) {
      showEmptyTarget("This transcript has no messages.", backHref, groupName);
      return;
    }

    renderNegotiationMessages();
    setupNegotiationInput();
    revealUpTo(1);
    startNegoMessageTimer();
  }

  async function init() {
    if (isNegotiation) { await initNegotiation(); return; }
    if (isDigest) { await initDigest(); return; }

    let data;
    try { data = await loadDomain(); }
    catch (err) { showEmptyTarget(`Couldn't load ${domain} data. Has scripts/fetch_attack.py been run yet?`); console.error(err); return; }

    const entity = data.byId[type] && data.byId[type][id];
    if (!entity) { showEmptyTarget(`No record for "${escapeHtml(id)}" in the ${domain} domain.`); return; }

    setupBackLink();
    const selfLabel = type === "techniques" ? techniqueLabel(entity, data) : entity.name;

    if (type === "groups") slides = buildGroupSlides(entity, data, selfLabel);
    else if (type === "techniques") slides = buildTechniqueSlides(entity, data, selfLabel);
    else if (type === "software") slides = buildSoftwareSlides(entity, data, selfLabel);

    renderChrome();
    renderSlides();
    setupInput();
    goTo(0);
  }

  init();
})();
</script>
