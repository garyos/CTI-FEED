<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SIGNAL — Spotlight Dossier</title>
<style>
  :root {
    --ink: #05070a;
    --ink-raised: #10151d;
    --ink-input: #0d1219;
    --line: #1e2733;
    --text: #d7dde5;
    --text-dim: #7d8998;
    --amber: #ffb020;
    --red: #ff5c5c;
    --blue: #5ac8ff;
    --green: #4fd58a;
    --purple: #c792ea;
    --teal: #2dd4bf;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--ink); }
  body { font-family: var(--font-mono); color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .stage {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(ellipse 120% 90% at 50% 20%, #16202f 0%, #05070a 60%),
      var(--ink);
    -webkit-user-select: none; user-select: none;
  }
  .stage::before {
    content: ""; position: absolute; inset: -20% 0; pointer-events: none; z-index: 30;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    animation: scandrift 9s linear infinite;
  }
  @keyframes scandrift { from { transform: translateY(0); } to { transform: translateY(24px); } }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 31;
    box-shadow: inset 0 0 140px rgba(0,0,0,0.75);
  }

  .progress-bar {
    position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 22;
    display: flex; gap: 4px;
  }
  .seg { flex: 1; height: 3px; background: rgba(255,255,255,0.15); border-radius: 1px; overflow: hidden; }
  .seg-fill { height: 100%; width: 0%; background: var(--amber); box-shadow: 0 0 6px var(--amber); }

  .topbar {
    position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 12px); left: 12px; right: 12px; z-index: 22;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  /* exit-link and stamp are fixed-size chrome; only the case-id block (which
     already wraps its own text to 2 lines) should ever shrink for space —
     without flex-shrink:0 here, a long case-id line squeezes exit-link down
     to a sliver via the flex default instead of wrapping the middle column. */
  .exit-link {
    flex: 0 0 auto;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--line); background: rgba(10,14,20,0.7); padding: 6px 10px; letter-spacing: 0.04em;
    max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .exit-link:hover { color: var(--red); border-color: var(--red); }
  .case-id-wrap { flex: 1 1 auto; min-width: 0; }
  .case-id {
    font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.08em; text-align: center;
    text-transform: uppercase;
  }
  .paused-flag {
    font-size: 9px; color: var(--amber); letter-spacing: 0.1em; margin-top: 3px; opacity: 0;
    text-align: center; transition: opacity 0.2s ease;
  }
  .paused-flag.on { opacity: 1; }
  .stamp {
    flex: 0 0 auto;
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--red);
    border: 2px solid var(--red); padding: 3px 7px; transform: rotate(-6deg); opacity: 0.75;
    text-align: center; line-height: 1.3; white-space: nowrap;
  }

  .slides { position: absolute; inset: 0; z-index: 10; }
  /* .slide is a plain block scroll container — NOT itself a flex box with
     justify-content:center, which combined with overflow:auto makes the
     start of overflowing content unreachable by scroll in most browsers.
     Centering happens on .slide-inner instead, which has no fixed height
     so it simply grows (no centering bug) once content exceeds one screen. */
  .slide {
    position: absolute; inset: 0; display: none;
    padding: 92px 22px 64px; overflow-y: auto;
  }
  .slide.active { display: block; animation: slideIn 0.35s ease; }
  .slide-inner { min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
  /* Slides with expand/collapse content (Coverage, Arsenal) must NOT vertically
     center — centering re-flows the whole block on every toggle, so a second tap
     in the same spot (e.g. the double-tap-to-resume gesture) lands on whatever
     content shifted into that position instead of what the user was looking at. */
  .slide-inner.top-align { justify-content: flex-start; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .section-label {
    font-size: 11px; letter-spacing: 0.14em; color: var(--amber); margin-bottom: 16px; opacity: 0.9;
  }
  .section-label::before { content: "// "; opacity: 0.6; }
  .subhead {
    font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 8px; text-transform: uppercase;
  }

  /* redaction-reveal motif for headline text */
  .redact { position: relative; display: inline-block; }
  .redact::after {
    content: ""; position: absolute; inset: -2px -4px; background: #05070a; transform-origin: right;
  }
  .slide.active .redact::after { animation: declassify 0.55s ease forwards; animation-delay: 0.2s; }
  @keyframes declassify { to { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) {
    .redact::after { transform: scaleX(0); }
  }

  /* --- title slide --- */
  .case-number { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 10px; }
  .slide-title h1 {
    font-family: var(--font-sans); font-size: clamp(28px, 8vw, 44px); margin: 0 0 12px; line-height: 1.1;
    letter-spacing: 0.01em;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tag-chip {
    font-size: 10.5px; color: var(--text-dim); border: 1px solid var(--line); padding: 4px 9px;
    letter-spacing: 0.03em;
  }
  .flag-chip { font-size: 13px; }

  .gauge-wrap { margin: 18px 0 16px; }
  .gauge-label { font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 6px; }
  .gauge-label b { color: var(--gauge-color, var(--amber)); }
  .gauge-track { height: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); position: relative; }
  .gauge-track::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 1px), rgba(255,255,255,0.15) 10%);
  }
  .gauge-fill { height: 100%; width: 0%; background: var(--gauge-color, var(--amber)); box-shadow: 0 0 10px var(--gauge-color, var(--amber)); }
  .gauge-caption { font-size: 9.5px; color: var(--text-dim); margin-top: 6px; opacity: 0.8; }

  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; color: var(--amber);
    border: 1px solid var(--amber); padding: 5px 9px; background: rgba(255,176,32,0.08);
  }

  /* --- origin / profile slide --- */
  .dossier-text {
    font-family: var(--font-sans); font-size: 15px; line-height: 1.7; color: var(--text);
    white-space: pre-line; max-width: 60ch;
  }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .meta-cell { border: 1px solid var(--line); padding: 10px 12px; }
  .meta-cell span { display: block; font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.08em; margin-bottom: 4px; }
  .meta-cell b { font-family: var(--font-sans); font-size: 14px; }

  /* --- coverage / scan slide --- */
  .scan-list { display: flex; flex-direction: column; gap: 4px; }
  .scan-row {
    display: grid; grid-template-columns: 1fr 34px; align-items: center; gap: 10px; font-size: 11px;
    width: 100%; padding: 6px 0;
  }
  button.scan-row {
    background: none; border: none; color: inherit; font-family: inherit; cursor: pointer; text-align: left;
  }
  .scan-row .sname { color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scan-row.hit .sname { color: var(--text); }
  button.scan-row.hit .sname::after { content: " ▾"; color: var(--teal); font-size: 9px; }
  .scan-row .strack { height: 6px; background: rgba(255,255,255,0.06); margin-top: 3px; }
  .scan-row .sfill { height: 100%; width: 0%; background: var(--teal); box-shadow: 0 0 6px var(--teal); transition: width 0.5s ease; }
  .scan-row .scount { text-align: right; color: var(--text-dim); font-size: 10px; }
  .scan-detail { padding: 2px 0 10px 2px; }
  .scan-detail[hidden] { display: none; }

  .chip {
    font-size: 11px; padding: 5px 10px; background: var(--ink-input); border: 1px solid var(--line);
    color: var(--text); text-decoration: none; display: inline-block;
  }
  .chip:hover { border-color: var(--teal); color: var(--teal); }

  /* --- arsenal slide --- */
  .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .asset-card {
    text-align: left; background: var(--ink-raised); border: 1px solid var(--line); border-left: 2px solid var(--purple);
    color: var(--text); font-family: var(--font-mono); padding: 9px 10px; cursor: pointer;
  }
  .asset-card .aid { font-size: 9px; color: var(--text-dim); }
  .asset-card .aname { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .asset-card .adesc { font-size: 10.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.45; display: none; }
  .asset-card.expanded .adesc { display: block; }
  .asset-card.expanded { border-left-color: var(--amber); }
  .zoom-link {
    display: inline-block; margin-top: 8px; font-size: 10px; color: var(--amber); text-decoration: none;
    letter-spacing: 0.04em;
  }
  .zoom-link:hover { text-decoration: underline; }

  /* --- campaigns / timeline slide --- */
  .timeline { position: relative; padding-left: 18px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; }
  .tl-entry { position: relative; }
  .tl-entry::before {
    content: ""; position: absolute; left: -22.5px; top: 3px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 6px var(--red);
  }
  .tl-year { font-size: 10px; color: var(--red); letter-spacing: 0.08em; margin-bottom: 3px; }
  .tl-name { font-family: var(--font-sans); font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .tl-desc { font-size: 12px; color: var(--text-dim); line-height: 1.55; max-width: 56ch; }

  /* --- connections / used-by slide --- */
  .orbit-wrap { position: relative; height: 130px; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; }
  .orbit-center {
    width: 14px; height: 14px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 14px var(--amber); z-index: 1;
  }
  .orbit-ring { position: absolute; inset: 0; animation: spin 16s linear infinite; }
  .orbit-ring.rev { animation-direction: reverse; animation-duration: 22s; }
  .orbit-dot {
    position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue); box-shadow: 0 0 6px var(--blue);
    transform: rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a)));
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .associate-list { display: flex; flex-direction: column; gap: 8px; }
  .associate-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--ink-raised); border: 1px solid var(--line); border-left: 2px solid var(--blue);
    padding: 10px 12px; text-decoration: none; color: var(--text);
  }
  .associate-row:hover { border-left-color: var(--amber); }
  .ar-name { font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; }
  .ar-score { font-size: 10px; color: var(--text-dim); white-space: nowrap; }

  /* --- defense slide --- */
  .counter-list { display: flex; flex-direction: column; gap: 14px; }
  .counter-entry { display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
  .cnum { font-size: 16px; color: var(--green); font-weight: 700; opacity: 0.8; }
  .cname { font-family: var(--font-sans); font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .cdesc { font-size: 11.5px; color: var(--text-dim); line-height: 1.5; max-width: 56ch; }

  /* --- nav --- */
  /* purely a visual/documentation region — pointer-events:none so it never
     shadows interactive elements inside the active slide underneath it;
     navigation is decided by tap x-position in the #stage pointer handler */
  .tap-zone { position: absolute; top: 88px; bottom: 96px; z-index: 15; pointer-events: none; }
  .tap-left { left: 0; width: 30%; }
  .tap-right { right: 0; width: 70%; }
  .hint {
    position: absolute; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 56px); left: 0; right: 0; z-index: 22;
    text-align: center; font-size: 10px; color: var(--text-dim); opacity: 0.7; pointer-events: none;
    letter-spacing: 0.04em;
  }

  /* Explicit, persistent pause/resume control — takes precedence over every
     touch/tap gesture (see manualPauseLock in the script). A big, unambiguous
     target for readers who don't want to rely on landing a double-tap. */
  .pause-btn {
    position: absolute; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 24;
    transform: translateX(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(16,21,29,0.92); border: 2px solid var(--amber); color: var(--amber);
    font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 0 16px rgba(255,176,32,0.25);
  }
  .pause-btn:hover { filter: brightness(1.15); }
  .pause-btn.active { border-color: var(--red); color: var(--red); box-shadow: 0 0 16px rgba(255,92,92,0.35); }

  .empty-target {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px; z-index: 20;
  }
  .empty-target a { color: var(--amber); }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="progress-bar" id="progress-bar"></div>
    <div class="topbar">
      <a class="exit-link no-nav" id="exit-link" href="attack.html">‹ EXIT</a>
      <div class="case-id-wrap">
        <div class="case-id" id="case-id">SIGNAL // SPOTLIGHT</div>
        <div class="paused-flag" id="paused-flag">‖ PAUSED — DOUBLE-TAP TO RESUME</div>
      </div>
      <div class="stamp">CLASSIFIED<br>EYES ONLY</div>
    </div>

    <div class="slides" id="slides"></div>
    <div class="tap-zone tap-left" id="tap-left"></div>
    <div class="tap-zone tap-right" id="tap-right"></div>
    <div class="hint" id="hint">tap right to advance · left to go back · tap an item to inspect</div>
    <button class="pause-btn no-nav" id="pause-btn" aria-label="Pause auto-advance">‖</button>
  </div>

<script>
(() => {
  const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const params = new URLSearchParams(location.search);
  const domain = params.get("domain") || "enterprise";
  let type = params.get("type") || (params.get("group") ? "groups" : null);
  const id = params.get("id") || params.get("group");
  const fromUrl = params.get("from");
  const fromName = params.get("fromName");

  const TYPE_META = {
    groups: { caseLabel: "CASE FILE", pageLabel: "ACTOR" },
    techniques: { caseLabel: "TECHNIQUE FILE", pageLabel: "TECHNIQUE" },
    software: { caseLabel: "ASSET FILE", pageLabel: "ASSET" },
  };
  if (!TYPE_META[type]) type = "groups";

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }
  function flagEmoji(code) {
    if (!code || code.length !== 2) return "🏳";
    return [...code.toUpperCase()].map(c => String.fromCodePoint(127397 + c.charCodeAt(0))).join("");
  }

  function zoomHref(zType, zId, selfLabel) {
    const p = new URLSearchParams();
    p.set("domain", domain);
    p.set("type", zType);
    p.set("id", zId);
    p.set("from", location.pathname + location.search);
    p.set("fromName", selfLabel);
    return "spotlight.html?" + p.toString();
  }

  function showEmptyTarget(message) {
    document.getElementById("stage").innerHTML = `
      <div class="empty-target">
        <div class="stamp" style="transform:rotate(-4deg)">NO TARGET<br>SELECTED</div>
        <div style="color:var(--text-dim); font-size:13px; max-width:40ch;">${escapeHtml(message)}</div>
        <a href="attack.html" style="font-family:var(--font-mono); font-size:12px;">‹ return to ATT&amp;CK Explorer</a>
      </div>`;
  }

  async function loadDomain() {
    const res = await fetch(`data/attack/${domain}.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    data.byId = { techniques: {}, groups: {}, software: {}, campaigns: {}, mitigations: {}, tactics: {} };
    for (const key of Object.keys(data.byId)) {
      data.byId[key] = Object.fromEntries((data[key] || []).map(e => [e.id, e]));
    }
    return data;
  }

  function techniqueLabel(t, data) {
    if (t.parent && data.byId.techniques[t.parent]) return `${data.byId.techniques[t.parent].name}: ${t.name}`;
    return t.name;
  }

  function groupsUsingSoftware(s, data) {
    return data.groups.filter(g => g.software.includes(s.id));
  }

  function percentile(arr, p) {
    const s = [...arr].sort((a, b) => a - b);
    if (!s.length) return 0;
    return s[Math.min(s.length - 1, Math.floor(s.length * p))];
  }

  function computeAssessment(group, data) {
    const techCounts = data.groups.map(g => g.techniques.length);
    const softCounts = data.groups.map(g => g.software.length);
    const techMax = Math.max(1, ...techCounts);
    const tacticsTouched = new Set(group.techniques.flatMap(tid => data.byId.techniques[tid]?.tactics || []));
    const coveragePct = data.tactics.length ? (tacticsTouched.size / data.tactics.length) * 100 : 0;
    const techPct = (group.techniques.length / techMax) * 100;
    const score = Math.round((techPct + coveragePct) / 2);

    let level, color;
    if (score >= 75) { level = "CRITICAL"; color = "var(--red)"; }
    else if (score >= 50) { level = "HIGH"; color = "var(--amber)"; }
    else if (score >= 25) { level = "MODERATE"; color = "var(--teal)"; }
    else { level = "LOW"; color = "var(--text-dim)"; }

    const techP75 = percentile(techCounts, 0.75);
    const softP75 = percentile(softCounts, 0.75);
    const badges = [];
    if (group.countries.length) badges.push("STATE-LINKED");
    if (coveragePct >= 80) badges.push("FULL SPECTRUM");
    if (techP75 > 0 && group.techniques.length >= techP75) badges.push("PROLIFIC OPERATOR");
    if (softP75 > 0 && group.software.length >= softP75) badges.push("HEAVY ARSENAL");
    if (group.campaigns.length >= 2) badges.push("ACTIVE CAMPAIGNS");
    if (!badges.length) badges.push("LOW PROFILE");

    return { score, level, color, coveragePct, tacticsTouched, badges };
  }

  function relatedGroups(group, data, limit = 6) {
    const mySoft = new Set(group.software);
    const myTech = new Set(group.techniques);
    return data.groups
      .filter(g => g.id !== group.id)
      .map(g => {
        const softOverlap = g.software.filter(id => mySoft.has(id)).length;
        const techOverlap = g.techniques.filter(id => myTech.has(id)).length;
        return { g, score: softOverlap * 3 + techOverlap };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, limit);
  }

  function mitigationsFor(techniqueIds, data, limit = 10) {
    const freq = {};
    techniqueIds.forEach(tid => {
      (data.byId.techniques[tid]?.mitigations || []).forEach(mid => { freq[mid] = (freq[mid] || 0) + 1; });
    });
    return Object.entries(freq)
      .sort((a, b) => b[1] - a[1])
      .slice(0, limit)
      .map(([mid]) => data.byId.mitigations[mid])
      .filter(Boolean);
  }

  // ---------- shared slide builders ----------

  function titleSlide(g, data, assessment) {
    return {
      key: "title", duration: 4500,
      html: `
        <div class="case-number">CASE FILE // ${g.id} // ${escapeHtml(domain.toUpperCase())}</div>
        <h1 class="redact">${escapeHtml(g.name)}</h1>
        <div class="chip-row">
          ${g.countries.map(c => `<span class="tag-chip flag-chip">${flagEmoji(c.code)} ${escapeHtml(c.name)}</span>`).join("")}
          ${g.aliases.filter(a => a !== g.name).slice(0, 6).map(a => `<span class="tag-chip">${escapeHtml(a)}</span>`).join("")}
        </div>
        <div class="gauge-wrap" style="--gauge-color:${assessment.color}">
          <div class="gauge-label">THREAT ASSESSMENT: <b>${assessment.level}</b> (${assessment.score}/100)</div>
          <div class="gauge-track"><div class="gauge-fill" style="width:${assessment.score}%"></div></div>
          <div class="gauge-caption">derived from technique breadth &amp; kill-chain coverage — not an official rating</div>
        </div>
        <div class="badge-row">${assessment.badges.map(b => `<span class="badge">${b}</span>`).join("")}</div>
      `,
    };
  }

  function originSlide(g) {
    return {
      key: "origin", duration: 8500,
      html: `
        <div class="section-label">Origin &amp; Identity</div>
        <p class="dossier-text">${escapeHtml(g.description) || "No description on file."}</p>
        <div class="meta-grid">
          <div class="meta-cell"><span>ALIASES ON RECORD</span><b>${g.aliases.length}</b></div>
          <div class="meta-cell"><span>ATTRIBUTION</span><b>${g.countries.map(c => c.name).join(", ") || "UNKNOWN"}</b></div>
        </div>
      `,
    };
  }

  function coverageSlide(g, data, selfLabel) {
    const rows = data.tactics.map(t => {
      const techs = g.techniques.map(tid => data.byId.techniques[tid]).filter(t2 => t2 && t2.tactics.includes(t.id));
      return { t, techs };
    });
    const max = Math.max(1, ...rows.map(r => r.techs.length));
    return {
      key: "coverage", duration: 6500,
      html: `
        <div class="section-label">Kill-Chain Scan</div>
        <div class="scan-list">
          ${rows.map(({ t, techs }, i) => {
            const pct = techs.length ? (techs.length / max * 100).toFixed(0) : 0;
            const rowTag = techs.length ? "button" : "div";
            const rowHtml = `
              <${rowTag} class="scan-row ${techs.length ? "hit no-nav" : ""}" data-i="${i}" data-pct="${pct}">
                <div>
                  <div class="sname">${escapeHtml(t.name)}</div>
                  <div class="strack"><div class="sfill"></div></div>
                </div>
                <div class="scount">${techs.length || "—"}</div>
              </${rowTag}>`;
            const detailHtml = techs.length ? `
              <div class="scan-detail" data-i="${i}" hidden>
                <div class="chip-row">
                  ${techs.map(tq => `<a class="chip no-nav" href="${zoomHref("techniques", tq.id, selfLabel)}">${escapeHtml(techniqueLabel(tq, data))}</a>`).join("")}
                </div>
              </div>` : "";
            return rowHtml + detailHtml;
          }).join("")}
        </div>
      `,
      onMount(el) {
        const rowsEl = [...el.querySelectorAll(".scan-row")];
        rowsEl.forEach((row, i) => {
          const fill = row.querySelector(".sfill");
          const pct = row.dataset.pct;
          if (REDUCED_MOTION) { fill.style.width = pct + "%"; return; }
          setTimeout(() => { fill.style.width = pct + "%"; }, 60 * i);
        });
        el.querySelectorAll("button.scan-row").forEach(row => {
          row.addEventListener("click", (e) => {
            e.stopPropagation();
            const i = row.dataset.i;
            const detail = el.querySelector(`.scan-detail[data-i="${i}"]`);
            const willOpen = detail.hidden;
            el.querySelectorAll(".scan-detail").forEach(d => { d.hidden = true; });
            detail.hidden = !willOpen;
          });
        });
      },
    };
  }

  function arsenalSlide(g, data, selfLabel) {
    const items = g.software.map(id => data.byId.software[id]).filter(Boolean);
    return {
      key: "arsenal", duration: 7500,
      html: `
        <div class="section-label">Arsenal On Record (${items.length})</div>
        <div class="asset-grid">
          ${items.map(s => `
            <div class="asset-card no-nav" data-id="${s.id}" tabindex="0" role="button">
              <div class="aid">${s.id} · ${s.type}</div>
              <div class="aname">${escapeHtml(s.name)}</div>
              <div class="adesc">
                <div>${escapeHtml((s.description || "No description on file.").slice(0, 220))}${(s.description || "").length > 220 ? "…" : ""}</div>
                <a class="zoom-link no-nav" href="${zoomHref("software", s.id, selfLabel)}">open full dossier ⌕</a>
              </div>
            </div>`).join("")}
        </div>
      `,
      onMount(el) {
        el.querySelectorAll(".asset-card").forEach(card => {
          const toggle = () => card.classList.toggle("expanded");
          card.addEventListener("click", (e) => {
            if (e.target.closest(".zoom-link")) return; // let the link navigate normally
            e.stopPropagation();
            toggle();
          });
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
          });
        });
      },
    };
  }

  function campaignsSlide(items) {
    items = [...items].sort((a, b) => (a.first_seen || "").localeCompare(b.first_seen || ""));
    return {
      key: "campaigns", duration: 7000,
      html: `
        <div class="section-label">Operations Log (${items.length})</div>
        <div class="timeline">
          ${items.map(c => `
            <div class="tl-entry">
              <div class="tl-year">${(c.first_seen || "").slice(0, 4) || "DATE UNKNOWN"}${c.last_seen && c.last_seen.slice(0, 4) !== (c.first_seen || "").slice(0, 4) ? " – " + c.last_seen.slice(0, 4) : ""}</div>
              <div class="tl-name">${escapeHtml(c.name)}</div>
              <div class="tl-desc">${escapeHtml((c.description || "").slice(0, 260))}${(c.description || "").length > 260 ? "…" : ""}</div>
            </div>`).join("")}
        </div>
      `,
    };
  }

  function connectionsSlide(related, selfLabel) {
    const dots = Array.from({ length: 10 }, (_, i) => {
      const a = (360 / 10) * i;
      return `<div class="orbit-dot" style="--a:${a}deg; --r:${50 + (i % 3) * 12}px"></div>`;
    }).join("");
    return {
      key: "connections", duration: 6500,
      html: `
        <div class="section-label">Known Associates</div>
        <div class="orbit-wrap" aria-hidden="true">
          <div class="orbit-ring">${dots}</div>
          <div class="orbit-ring rev">${dots}</div>
          <div class="orbit-center"></div>
        </div>
        <div class="associate-list">
          ${related.map(({ g: other, score }) => `
            <a class="associate-row no-nav" href="${zoomHref("groups", other.id, selfLabel)}">
              <span class="ar-name">${escapeHtml(other.name)}</span>
              <span class="ar-score">${score} shared TTP${score === 1 ? "" : "s"}</span>
            </a>`).join("")}
        </div>
      `,
    };
  }

  function defenseSlide(items) {
    return {
      key: "defense", duration: 7500,
      html: `
        <div class="section-label">Recommended Countermeasures</div>
        <div class="counter-list">
          ${items.map((m, i) => `
            <div class="counter-entry">
              <div class="cnum">${String(i + 1).padStart(2, "0")}</div>
              <div>
                <div class="cname">${escapeHtml(m.name)}</div>
                <div class="cdesc">${escapeHtml((m.description || "").slice(0, 220))}${(m.description || "").length > 220 ? "…" : ""}</div>
              </div>
            </div>`).join("")}
        </div>
      `,
    };
  }

  // used by technique + software dossiers to cross-link into groups/software/techniques
  function crossRefSlide(groupsList, softwareList, techniquesList, data, selfLabel) {
    const sections = [];
    if (groupsList.length) sections.push({
      label: "GROUPS", rows: groupsList.map(g => ({ href: zoomHref("groups", g.id, selfLabel), name: g.name, meta: g.countries.map(c => flagEmoji(c.code)).join("") })),
    });
    if (softwareList.length) sections.push({
      label: "SOFTWARE & TOOLS", rows: softwareList.map(s => ({ href: zoomHref("software", s.id, selfLabel), name: s.name, meta: s.type })),
    });
    if (techniquesList.length) sections.push({
      label: "TECHNIQUES", rows: techniquesList.map(t => ({ href: zoomHref("techniques", t.id, selfLabel), name: techniqueLabel(t, data), meta: t.id })),
    });
    return {
      key: "usedby", duration: 7500,
      html: `
        <div class="section-label">Observed Usage</div>
        ${sections.map(s => `
          <div class="subhead">${s.label} (${s.rows.length})</div>
          <div class="associate-list" style="margin-bottom:18px;">
            ${s.rows.map(r => `
              <a class="associate-row no-nav" href="${r.href}">
                <span class="ar-name">${escapeHtml(r.name)}</span>
                <span class="ar-score">${escapeHtml(r.meta)}</span>
              </a>`).join("")}
          </div>`).join("")}
      `,
    };
  }

  // ---------- per-type title/profile slides ----------

  function techniqueTitleSlide(t, data) {
    const tacticNames = t.tactics.map(id => data.byId.tactics[id]?.name).filter(Boolean);
    return {
      key: "title", duration: 4500,
      html: `
        <div class="case-number">TECHNIQUE FILE // ${t.id} // ${escapeHtml(domain.toUpperCase())}</div>
        <h1 class="redact">${escapeHtml(techniqueLabel(t, data))}</h1>
        <div class="chip-row">
          ${tacticNames.map(n => `<span class="tag-chip">${escapeHtml(n)}</span>`).join("")}
          ${t.platforms.map(p => `<span class="tag-chip">${escapeHtml(p)}</span>`).join("")}
        </div>
      `,
    };
  }

  function profileSlide(entity, label) {
    return {
      key: "origin", duration: 8000,
      html: `
        <div class="section-label">${escapeHtml(label)}</div>
        <p class="dossier-text">${escapeHtml(entity.description) || "No description on file."}</p>
      `,
    };
  }

  function softwareTitleSlide(s) {
    return {
      key: "title", duration: 4500,
      html: `
        <div class="case-number">ASSET FILE // ${s.id} // ${escapeHtml(domain.toUpperCase())}</div>
        <h1 class="redact">${escapeHtml(s.name)}</h1>
        <div class="chip-row">
          <span class="tag-chip">${escapeHtml(s.type)}</span>
          ${s.platforms.map(p => `<span class="tag-chip">${escapeHtml(p)}</span>`).join("")}
          ${s.aliases.filter(a => a !== s.name).slice(0, 6).map(a => `<span class="tag-chip">${escapeHtml(a)}</span>`).join("")}
        </div>
      `,
    };
  }

  // ---------- per-type slide-deck assembly ----------

  function buildGroupSlides(g, data, selfLabel) {
    const assessment = computeAssessment(g, data);
    const related = relatedGroups(g, data);
    const mitigations = mitigationsFor(g.techniques, data);

    const list = [titleSlide(g, data, assessment), originSlide(g), coverageSlide(g, data, selfLabel)];
    if (g.software.length) list.push(arsenalSlide(g, data, selfLabel));
    if (g.campaigns.length) list.push(campaignsSlide(g.campaigns.map(id => data.byId.campaigns[id]).filter(Boolean)));
    if (related.length) list.push(connectionsSlide(related, selfLabel));
    if (mitigations.length) list.push(defenseSlide(mitigations));
    return list;
  }

  function buildTechniqueSlides(t, data, selfLabel) {
    const list = [techniqueTitleSlide(t, data), profileSlide(t, "Technique Profile")];
    const groupsList = t.groups.map(id => data.byId.groups[id]).filter(Boolean);
    const softwareList = t.software.map(id => data.byId.software[id]).filter(Boolean);
    if (groupsList.length || softwareList.length) list.push(crossRefSlide(groupsList, softwareList, [], data, selfLabel));
    const campaignsList = (t.campaigns || []).map(id => data.byId.campaigns[id]).filter(Boolean);
    if (campaignsList.length) list.push(campaignsSlide(campaignsList));
    const mitigations = (t.mitigations || []).map(id => data.byId.mitigations[id]).filter(Boolean);
    if (mitigations.length) list.push(defenseSlide(mitigations));
    return list;
  }

  function buildSoftwareSlides(s, data, selfLabel) {
    const list = [softwareTitleSlide(s), profileSlide(s, "Asset Profile")];
    const groupsList = groupsUsingSoftware(s, data);
    const techniquesList = s.techniques.map(id => data.byId.techniques[id]).filter(Boolean);
    if (groupsList.length || techniquesList.length) list.push(crossRefSlide(groupsList, [], techniquesList, data, selfLabel));
    const campaignsList = (s.campaigns || []).map(id => data.byId.campaigns[id]).filter(Boolean);
    if (campaignsList.length) list.push(campaignsSlide(campaignsList));
    return list;
  }

  // ---------- engine ----------

  let slides = [];
  let idx = 0;
  let timerRAF = null;
  let timerStart = 0;
  let timerDuration = 0;
  let isPaused = false;
  let pauseBegan = 0;
  let interactionPaused = false;
  let pendingNavTimer = null;
  // manualPauseLock is the explicit pause/resume button's state. It takes
  // precedence over every touch/tap control: while engaged, resumeTimer()
  // refuses to run (so double-tap and swipe can't silently undo it), and a
  // freshly-entered slide starts paused instead of auto-running. Only the
  // button itself (toggleManualPause) can clear it. Built for readers who
  // can't reliably land a double-tap and need a deliberate, persistent control.
  let manualPauseLock = false;

  function updateStatusUI() {
    const flag = document.getElementById("paused-flag");
    const btn = document.getElementById("pause-btn");
    flag.classList.toggle("on", manualPauseLock || interactionPaused);
    flag.textContent = manualPauseLock ? "‖ PAUSED — TAP ▶ TO RESUME" : "‖ PAUSED — DOUBLE-TAP TO RESUME";
    btn.textContent = manualPauseLock ? "▶" : "‖";
    btn.setAttribute("aria-label", manualPauseLock ? "Resume auto-advance" : "Pause auto-advance");
    btn.classList.toggle("active", manualPauseLock);
  }

  function toggleManualPause() {
    if (manualPauseLock) {
      manualPauseLock = false;
      resumeTimer();
    } else {
      manualPauseLock = true;
      interactionPaused = false;
      if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
      pauseTimer();
    }
    updateStatusUI();
  }

  function renderChrome() {
    document.getElementById("case-id").textContent = `SIGNAL // SPOTLIGHT // ${TYPE_META[type].pageLabel} // ${domain.toUpperCase()}`;
    document.getElementById("progress-bar").innerHTML = slides.map(() => `<div class="seg"><div class="seg-fill"></div></div>`).join("");
  }

  const EXPANDABLE_SLIDE_KEYS = new Set(["coverage", "arsenal"]);

  function renderSlides() {
    const root = document.getElementById("slides");
    root.innerHTML = slides.map((s, i) => `
      <div class="slide" data-i="${i}" data-key="${s.key}">
        <div class="slide-inner ${EXPANDABLE_SLIDE_KEYS.has(s.key) ? "top-align" : ""}">${s.html}</div>
      </div>`).join("");
    slides.forEach((s, i) => {
      if (s.onMount) s.onMount(root.querySelector(`.slide[data-i="${i}"]`));
    });
  }

  function segFills() { return [...document.querySelectorAll(".seg-fill")]; }

  function setSegProgress(i, pct) {
    const fills = segFills();
    if (fills[i]) fills[i].style.width = pct + "%";
  }

  function syncSegsForIndex(i) {
    segFills().forEach((fill, si) => { fill.style.width = si < i ? "100%" : si > i ? "0%" : fill.style.width; });
  }

  function cancelTimer() {
    if (timerRAF) cancelAnimationFrame(timerRAF);
    timerRAF = null;
  }

  function startTimer(duration) {
    cancelTimer();
    timerDuration = duration;
    timerStart = performance.now();
    // A manual pause persists across navigation — a slide reached while paused
    // starts paused too, rather than silently resuming autoplay behind the reader.
    isPaused = manualPauseLock;
    if (isPaused) pauseBegan = timerStart;
    updateStatusUI();
    if (REDUCED_MOTION) { setSegProgress(idx, manualPauseLock ? 0 : 100); return; }
    setSegProgress(idx, 0);
    tick();
  }

  function tick() {
    if (!isPaused) {
      const elapsed = performance.now() - timerStart;
      const frac = Math.min(1, elapsed / timerDuration);
      setSegProgress(idx, frac * 100);
      if (frac >= 1) { timerRAF = null; next(true); return; }
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function pauseTimer() { if (!isPaused) { isPaused = true; pauseBegan = performance.now(); } updateStatusUI(); }
  function resumeTimer() {
    if (manualPauseLock) return; // locked — only the pause/resume button can clear this
    if (isPaused) { isPaused = false; timerStart += performance.now() - pauseBegan; }
    updateStatusUI();
  }

  function goTo(i) {
    if (i < 0 || i >= slides.length) return;
    const root = document.getElementById("slides");
    root.querySelectorAll(".slide").forEach(el => el.classList.remove("active"));
    idx = i;
    root.querySelector(`.slide[data-i="${i}"]`).classList.add("active");
    syncSegsForIndex(i);
    interactionPaused = false;
    if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
    startTimer(slides[i].duration);
  }

  function next(fromTimer) {
    if (idx < slides.length - 1) { goTo(idx + 1); }
    else if (!fromTimer) { /* already at the end, tapping right does nothing further */ }
  }
  function prev() { if (idx > 0) goTo(idx - 1); }

  function setupInput() {
    const stage = document.getElementById("stage");
    let downAt = null, downX = 0, downY = 0, moved = false, downOnNoNav = false;
    let lastTapAt = 0;
    const DOUBLE_TAP_MS = 340;

    document.getElementById("pause-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleManualPause();
    });

    function performNav(clientX) {
      const w = window.innerWidth;
      if (clientX < w * 0.3) prev(); else next();
    }

    // A swipe always navigates, even if it starts on a card or link — a card-dense
    // slide (Arsenal, Connections) must never trap the user with no way to move on.
    //
    // A short tap on an interactive element (.no-nav) pauses the auto-advance timer
    // and KEEPS it paused — it does not resume on its own. Only a double-tap resumes
    // it (continuing the current slide's countdown toward the next slide). A single
    // background tap while paused this way is held for one double-tap window before
    // falling through to normal prev/next, so the two gestures don't collide.
    stage.addEventListener("pointerdown", (e) => {
      downAt = performance.now(); downX = e.clientX; downY = e.clientY; moved = false;
      downOnNoNav = !!e.target.closest(".no-nav");
      pauseTimer();
    });
    stage.addEventListener("pointermove", (e) => {
      if (downAt == null) return;
      if (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10) moved = true;
    });
    stage.addEventListener("pointerup", (e) => {
      if (downAt == null) return;
      const heldMs = performance.now() - downAt;
      const dx = e.clientX - downX;
      const wasOnNoNav = downOnNoNav;
      downAt = null;

      if (moved && Math.abs(dx) > 60) {
        interactionPaused = false;
        if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
        resumeTimer();
        if (dx < 0) next(); else prev();
        return;
      }

      if (heldMs < 250 && !moved) {
        const now = performance.now();
        const isDoubleTap = (now - lastTapAt) < DOUBLE_TAP_MS;
        lastTapAt = isDoubleTap ? 0 : now;

        if (isDoubleTap && interactionPaused) {
          if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
          interactionPaused = false;
          resumeTimer();
          return;
        }

        if (wasOnNoNav) {
          interactionPaused = true;
          pauseTimer();
          return;
        }

        if (interactionPaused) {
          if (pendingNavTimer) clearTimeout(pendingNavTimer);
          const clientX = e.clientX;
          pendingNavTimer = setTimeout(() => { pendingNavTimer = null; performNav(clientX); }, DOUBLE_TAP_MS);
          return;
        }

        performNav(e.clientX);
        return;
      }
      resumeTimer();
    });
    stage.addEventListener("pointercancel", () => { downAt = null; resumeTimer(); });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") next();
      else if (e.key === "ArrowLeft") prev();
      else if (e.key === "Escape") { const el = document.getElementById("exit-link"); if (el) location.href = el.href; }
    });
  }

  function setupBackLink() {
    const el = document.getElementById("exit-link");
    if (fromUrl) { el.href = fromUrl; el.textContent = `‹ ${fromName || "back"}`; }
    else { el.href = "attack.html"; el.textContent = "‹ EXIT"; }
  }

  async function init() {
    if (!id) { showEmptyTarget("No target was specified. Open a dossier from the ATT&CK Explorer."); return; }
    let data;
    try { data = await loadDomain(); }
    catch (err) { showEmptyTarget(`Couldn't load ${domain} data. Has scripts/fetch_attack.py been run yet?`); console.error(err); return; }

    const entity = data.byId[type] && data.byId[type][id];
    if (!entity) { showEmptyTarget(`No record for "${escapeHtml(id)}" in the ${domain} domain.`); return; }

    setupBackLink();
    const selfLabel = type === "techniques" ? techniqueLabel(entity, data) : entity.name;

    if (type === "groups") slides = buildGroupSlides(entity, data, selfLabel);
    else if (type === "techniques") slides = buildTechniqueSlides(entity, data, selfLabel);
    else if (type === "software") slides = buildSoftwareSlides(entity, data, selfLabel);

    renderChrome();
    renderSlides();
    setupInput();
    goTo(0);
  }

  init();
})();
</script>
</body>
