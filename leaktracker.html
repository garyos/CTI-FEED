<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE SIGNAL — Ransomware Tracker</title>
<style>
  :root {
    --ink: #0a0e14;
    --ink-raised: #10151d;
    --ink-input: #0d1219;
    --line: #1e2733;
    --text: #d7dde5;
    --text-dim: #7d8998;
    --amber: #ffb020;
    --red: #ff5c5c;
    --blue: #5ac8ff;
    --green: #4fd58a;
    --purple: #c792ea;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .frame { max-width: 920px; margin: 0 auto; padding: 24px 16px 80px; }

  header.masthead {
    border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 18px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
  }
  .masthead h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 4px; }
  .masthead .sub { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .masthead nav { display: flex; gap: 8px; }
  .masthead nav a {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--line); padding: 6px 10px;
  }
  .masthead nav a:hover { color: var(--amber); border-color: var(--amber); }

  .view-toggle { display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 12px; }
  .view-toggle button {
    flex: 1; background: var(--ink-raised); color: var(--text-dim); border: none;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; padding: 10px 6px; cursor: pointer;
    text-transform: uppercase;
  }
  .view-toggle button.active { background: var(--ink); color: var(--green); font-weight: 600; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  select#group-filter, select#sector-filter, select#country-filter, select#month-select,
  select#raas-filter, select#active-filter, select#negotiation-filter, select#sort-select {
    font-family: var(--font-mono); font-size: 11.5px; padding: 6px 10px;
    background: var(--ink-input); color: var(--text); border: 1px solid var(--line); max-width: 200px;
  }
  .chip {
    font-family: var(--font-mono); font-size: 11.5px; padding: 6px 11px; border: 1px solid var(--line);
    background: var(--ink-raised); color: var(--text-dim); cursor: pointer; user-select: none;
  }
  .chip.active { color: var(--green); border-color: var(--green); }
  .search-wrap { flex: 1; min-width: 160px; display: flex; }
  #search-input {
    width: 100%; font-family: var(--font-mono); font-size: 12px; padding: 7px 10px;
    background: var(--ink-input); color: var(--text); border: 1px solid var(--line);
  }
  #search-input::placeholder { color: var(--text-dim); }
  .reset-btn {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); background: none;
    border: 1px solid var(--line); padding: 6px 10px; cursor: pointer;
  }
  .reset-btn:hover { color: var(--amber); border-color: var(--amber); }

  .archive-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-family: var(--font-mono);
    font-size: 11px; color: var(--text-dim); flex-wrap: wrap;
  }

  .result-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-bottom: 14px; }

  .feed { display: flex; flex-direction: column; }
  .entry {
    border-left: 3px solid var(--line); padding: 14px 16px; border-bottom: 1px solid var(--line);
    cursor: pointer; background: none; text-align: left; width: 100%; color: var(--text); font-family: var(--font-sans);
  }
  .entry:hover { background: #10151d; }
  .entry.victim { border-left-color: var(--red); }
  .entry.group { border-left-color: var(--green); }

  .entry .meta {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-bottom: 6px;
    display: flex; gap: 10px; text-transform: uppercase; letter-spacing: 0.04em; flex-wrap: wrap; align-items: center;
  }
  .entry.victim .tag { color: var(--red); }
  .entry.group .tag { color: var(--green); }
  .raas-badge { color: var(--amber); border: 1px solid var(--amber); padding: 1px 6px; font-size: 9.5px; letter-spacing: 0.06em; }
  .active-badge { color: var(--green); border: 1px solid var(--green); padding: 1px 6px; font-size: 9.5px; letter-spacing: 0.06em; }
  .inactive-badge { color: var(--text-dim); border: 1px solid var(--line); padding: 1px 6px; font-size: 9.5px; letter-spacing: 0.06em; }
  .nego-badge { color: var(--purple); border: 1px solid var(--purple); padding: 1px 6px; font-size: 9.5px; letter-spacing: 0.06em; }
  .flag-tag { font-size: 12px; margin-right: 2px; }
  .entry h2 { font-size: 15.5px; font-weight: 500; margin: 0 0 6px; line-height: 1.4; font-family: var(--font-mono); }
  .entry p { font-size: 13.5px; color: var(--text-dim); line-height: 1.55; margin: 0; font-family: var(--font-sans); }

  .empty-state {
    font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); padding: 40px 0;
    text-align: center; border: 1px dashed var(--line);
  }

  /* flyout */
  .flyout-backdrop {
    position: fixed; inset: 0; background: rgba(5,7,10,0.6); opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease; z-index: 40;
  }
  .flyout-backdrop.open { opacity: 1; pointer-events: auto; }
  .flyout {
    position: fixed; background: var(--ink-raised); border-left: 1px solid var(--line); z-index: 41;
    display: flex; flex-direction: column; top: 0; right: 0; bottom: 0; width: min(460px, 100%);
    transform: translateX(100%); transition: transform 0.25s ease;
  }
  .flyout.open { transform: translateX(0); }
  @media (max-width: 680px) {
    .flyout { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 88vh; border-left: none; border-top: 1px solid var(--line); transform: translateY(100%); }
    .flyout.open { transform: translateY(0); }
  }
  .flyout-head { display: flex; justify-content: flex-end; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .flyout-close { font-family: var(--font-mono); font-size: 16px; color: var(--text-dim); background: none; border: none; cursor: pointer; padding: 0 4px; }
  .flyout-close:hover { color: var(--red); }
  .flyout-body { padding: 16px; overflow-y: auto; flex: 1 1 auto; }
  .flyout-body .fid { font-family: var(--font-mono); font-size: 12px; color: var(--green); }
  .flyout-body h2 { font-size: 19px; margin: 4px 0 10px; font-family: var(--font-mono); }
  .flyout-summary { font-size: 13.5px; line-height: 1.65; color: var(--text); margin-bottom: 16px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .meta-cell { border: 1px solid var(--line); padding: 9px 11px; }
  .meta-cell span { display: block; font-size: 9px; color: var(--text-dim); letter-spacing: 0.07em; margin-bottom: 3px; text-transform: uppercase; }
  .meta-cell b { font-family: var(--font-mono); font-size: 13px; }
  .section-title {
    font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin: 20px 0 10px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .ref-list { display: flex; flex-direction: column; gap: 6px; }
  /* Deliberately not clickable — a leak-site/victim link could point at a live
     .onion or malicious domain, and this page should never risk an accidental
     click-through. Shown as plain read-only text, monospace so it still reads
     clearly as a URL. */
  .ref-list .ref-text { color: var(--text-dim); font-family: var(--font-mono); font-size: 11.5px; word-break: break-all; }
  .ref-list .ref-note { color: var(--text-dim); font-size: 9.5px; letter-spacing: 0.04em; text-transform: uppercase; margin-top: -4px; }
  .group-link {
    display: inline-block; margin-top: 4px; font-size: 11px; color: var(--green); text-decoration: none; cursor: pointer;
  }
  .group-link:hover { text-decoration: underline; }
  .nego-link {
    display: block; font-size: 12.5px; color: var(--purple); text-decoration: none; padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .nego-link:last-child { border-bottom: none; }
  .nego-link:hover { text-decoration: underline; }
  .nego-link .nl-sub { display: block; font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
  .nego-archive-list {
    display: flex; flex-direction: column; max-height: 280px; overflow-y: auto;
    border: 1px solid var(--line); margin-top: 10px;
  }
  .nego-archive-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 7px 10px; font-family: var(--font-mono); font-size: 11px; color: var(--text);
    text-decoration: none; border-bottom: 1px solid var(--line); background: none; cursor: pointer;
  }
  .nego-archive-row:last-child { border-bottom: none; }
  .nego-archive-row:hover { background: rgba(199,146,234,0.08); color: var(--purple); }
  .nego-archive-row .nar-date { color: var(--text-dim); }
  .nego-archive-row:hover .nar-date { color: var(--purple); }
  .nego-archive-row .nar-count { flex: 0 0 auto; }
  a.footer-link { color: var(--text-dim); }
  a.footer-link:hover { color: var(--amber); }
  footer { margin-top: 32px; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="frame">
    <header class="masthead">
      <div>
        <h1>RANSOMWARE TRACKER</h1>
        <div class="sub" id="status-line">loading…</div>
      </div>
      <nav>
        <a href="cve.html">‹ CVE</a>
        <a href="attack.html">‹ ATT&amp;CK</a>
        <a href="index.html">‹ feed</a>
      </nav>
    </header>

    <div class="view-toggle" id="view-toggle">
      <button data-view="victims" class="active">Victims</button>
      <button data-view="groups">Groups</button>
    </div>

    <div class="toolbar">
      <select id="group-filter"><option value="all">all groups</option></select>
      <select id="sector-filter"><option value="all">all sectors</option></select>
      <select id="country-filter"><option value="all">all countries</option></select>
      <select id="raas-filter" style="display:none">
        <option value="all">RaaS: all</option>
        <option value="yes">RaaS: yes</option>
        <option value="no">RaaS: no</option>
      </select>
      <select id="active-filter" style="display:none">
        <option value="all">status: all</option>
        <option value="yes">status: active</option>
        <option value="no">status: inactive</option>
      </select>
      <select id="negotiation-filter" style="display:none">
        <option value="all">negotiations: all</option>
        <option value="yes">negotiations: available</option>
        <option value="no">negotiations: none on file</option>
      </select>
      <select id="sort-select" style="display:none">
        <option value="name">sort: name (A–Z)</option>
        <option value="victims">sort: victim count (high–low)</option>
      </select>
      <div class="search-wrap"><input id="search-input" type="text" placeholder="search…" /></div>
      <button class="reset-btn" id="reset-btn">reset</button>
    </div>

    <div class="archive-row" id="archive-row">
      <span>viewing:</span>
      <select id="month-select"><option value="latest">most recent</option></select>
    </div>

    <div class="result-count" id="result-count"></div>
    <div class="feed" id="feed"><div class="empty-state">Loading ransomware tracker data…</div></div>

    <footer>
      Ransomware group &amp; leak-site victim data from
      <a class="footer-link" href="https://ransomware.live/" target="_blank" rel="noopener noreferrer">ransomware.live</a>
      by a scheduled GitHub Action · victims accumulate over time (seeded from a recent window, not the full historical archive) ·
      <a class="footer-link" href="data/leaktracker/latest.json">view raw data</a>
    </footer>
  </div>

  <div class="flyout-backdrop" id="flyout-backdrop"></div>
  <aside class="flyout" id="flyout">
    <div class="flyout-head"><button class="flyout-close" id="flyout-close">✕</button></div>
    <div class="flyout-body" id="flyout-body"></div>
  </aside>

<script>
(() => {
  let indexData = null;
  let groupsData = null;
  let currentView = "victims";
  let currentVictims = [];
  let currentMonth = "latest";
  let filters = { group: "all", sector: "all", country: "all", raas: "all", active: "all", negotiation: "all", sort: "name", search: "" };

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function flagEmoji(code) {
    if (!code || code.length !== 2) return "🏳";
    return [...code.toUpperCase()].map(c => String.fromCodePoint(127397 + c.charCodeAt(0))).join("");
  }

  async function loadJson(path) {
    const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  function groupByName(name) {
    return groupsData && groupsData.groups.find(g => g.name.toLowerCase() === (name || "").toLowerCase());
  }

  async function init() {
    try {
      [indexData, groupsData] = await Promise.all([loadJson("data/leaktracker/index.json"), loadJson("data/leaktracker/groups.json")]);
    } catch (err) {
      document.getElementById("feed").innerHTML = `<div class="empty-state">Couldn't load leak-site tracker data. Has scripts/fetch_leaktracker.py been run yet?</div>`;
      console.error(err);
      return;
    }

    const totalVictims = indexData.months.reduce((s, m) => s + m.count, 0);
    document.getElementById("status-line").textContent =
      `${totalVictims} victim postings across ${indexData.months.length} month(s) · ${groupsData.groups.length} tracked groups · last fetched ${new Date(indexData.last_fetched).toLocaleString()}`;

    const monthSelect = document.getElementById("month-select");
    monthSelect.innerHTML = `<option value="latest">most recent</option>` +
      indexData.months.map(m => `<option value="${m.key}">${m.key} (${m.count})</option>`).join("");

    document.querySelectorAll("#view-toggle button").forEach(btn => {
      btn.addEventListener("click", () => switchView(btn.dataset.view));
    });

    document.getElementById("group-filter").addEventListener("change", (e) => { filters.group = e.target.value; render(); });
    document.getElementById("sector-filter").addEventListener("change", (e) => { filters.sector = e.target.value; render(); });
    document.getElementById("country-filter").addEventListener("change", (e) => { filters.country = e.target.value; render(); });
    document.getElementById("raas-filter").addEventListener("change", (e) => { filters.raas = e.target.value; render(); });
    document.getElementById("active-filter").addEventListener("change", (e) => { filters.active = e.target.value; render(); });
    document.getElementById("negotiation-filter").addEventListener("change", (e) => { filters.negotiation = e.target.value; render(); });
    document.getElementById("sort-select").addEventListener("change", (e) => { filters.sort = e.target.value; render(); });
    document.getElementById("search-input").addEventListener("input", (e) => { filters.search = e.target.value; render(); });
    monthSelect.addEventListener("change", (e) => switchMonth(e.target.value));
    document.getElementById("reset-btn").addEventListener("click", resetFilters);
    document.getElementById("flyout-close").addEventListener("click", closeFlyout);
    document.getElementById("flyout-backdrop").addEventListener("click", closeFlyout);

    await switchMonth("latest");

    // Deep-link support: leaktracker.html?group=<name> (used by the Spotlight
    // digest's "focus in on the ransomware group" link) jumps straight to that
    // group's profile in the Groups view instead of the default victim feed.
    const urlParams = new URLSearchParams(location.search);
    const requestedGroup = urlParams.get("group");
    if (requestedGroup) {
      applyGroupFocus(requestedGroup);
    } else if (urlParams.get("view") === "groups") {
      // Broader deep-links (used by dashboard.html's click-through cards) —
      // land on the Groups view with one or more filters pre-applied, without
      // pinning to a single group.
      switchView("groups");
      const country = urlParams.get("country");
      const raas = urlParams.get("raas");
      const active = urlParams.get("active");
      const negotiation = urlParams.get("negotiations");
      const sort = urlParams.get("sort");
      if (country) { filters.country = country; document.getElementById("country-filter").value = country; }
      if (raas) { filters.raas = raas; document.getElementById("raas-filter").value = raas; }
      if (active) { filters.active = active; document.getElementById("active-filter").value = active; }
      if (negotiation) { filters.negotiation = negotiation; document.getElementById("negotiation-filter").value = negotiation; }
      if (sort) { filters.sort = sort; document.getElementById("sort-select").value = sort; }
      render();
    } else if (urlParams.get("country")) {
      // Plain ?country=<code> (no view=groups) — filter the default Victims
      // view by target/victim country instead.
      filters.country = urlParams.get("country");
      document.getElementById("country-filter").value = filters.country;
      render();
    }
  }

  function applyGroupFocus(name) {
    const match = groupsData.groups.find(g => g.name.toLowerCase() === name.toLowerCase());
    if (!match) return;
    switchView("groups");
    filters.group = match.name;
    document.getElementById("group-filter").value = match.name;
    render();
  }

  function resetFilters() {
    filters = { group: "all", sector: "all", country: "all", raas: "all", active: "all", negotiation: "all", sort: "name", search: "" };
    document.getElementById("group-filter").value = "all";
    document.getElementById("sector-filter").value = "all";
    document.getElementById("country-filter").value = "all";
    document.getElementById("raas-filter").value = "all";
    document.getElementById("active-filter").value = "all";
    document.getElementById("negotiation-filter").value = "all";
    document.getElementById("sort-select").value = "name";
    document.getElementById("search-input").value = "";
    render();
  }

  function switchView(view) {
    currentView = view;
    document.querySelectorAll("#view-toggle button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
    document.getElementById("archive-row").style.display = view === "victims" ? "flex" : "none";
    document.getElementById("sector-filter").style.display = view === "victims" ? "" : "none";
    // Country now applies to both views — victims via their own recorded
    // country, groups via a best-effort origin guess from their profile text
    // (see guess_countries() in fetch_leaktracker.py) — so it's just repopulated
    // per-view below rather than hidden for Groups.
    document.getElementById("raas-filter").style.display = view === "groups" ? "" : "none";
    document.getElementById("active-filter").style.display = view === "groups" ? "" : "none";
    document.getElementById("negotiation-filter").style.display = view === "groups" ? "" : "none";
    document.getElementById("sort-select").style.display = view === "groups" ? "" : "none";
    resetFilters();
    if (view === "groups") { renderGroupFilterOptions(); renderCountryFilterOptions(); }
    render();
  }

  async function switchMonth(month) {
    currentMonth = month;
    document.getElementById("feed").innerHTML = `<div class="empty-state">Loading…</div>`;
    try {
      const path = month === "latest" ? "data/leaktracker/latest.json" : `data/leaktracker/victims/${month}.json`;
      const data = await loadJson(path);
      currentVictims = data.victims || [];
    } catch (err) {
      document.getElementById("feed").innerHTML = `<div class="empty-state">Couldn't load that month's data.</div>`;
      console.error(err);
      return;
    }
    renderGroupFilterOptions();
    renderSectorFilterOptions();
    renderCountryFilterOptions();
    render();
  }

  function renderGroupFilterOptions() {
    const select = document.getElementById("group-filter");
    const prev = filters.group;
    let names;
    if (currentView === "groups") {
      names = groupsData.groups.map(g => g.name);
    } else {
      const counts = new Map();
      currentVictims.forEach(v => counts.set(v.group, (counts.get(v.group) || 0) + 1));
      names = [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([n]) => n);
    }
    select.innerHTML = `<option value="all">all groups</option>` + names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("");
    select.value = names.includes(prev) ? prev : "all";
    filters.group = select.value;
  }

  function renderSectorFilterOptions() {
    const select = document.getElementById("sector-filter");
    const prev = filters.sector;
    const counts = new Map();
    currentVictims.forEach(v => { if (v.sector) counts.set(v.sector, (counts.get(v.sector) || 0) + 1); });
    const sectors = [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([n]) => n);
    select.innerHTML = `<option value="all">all sectors</option>` + sectors.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)} (${counts.get(s)})</option>`).join("");
    select.value = sectors.includes(prev) ? prev : "all";
    filters.sector = select.value;
  }

  function renderCountryFilterOptions() {
    const select = document.getElementById("country-filter");
    const prev = filters.country;
    const counts = new Map();
    if (currentView === "groups") {
      // Groups carry an array of best-effort inferred origin countries
      // (guess_countries() in fetch_leaktracker.py), not a single field.
      groupsData.groups.forEach(g => (g.countries || []).forEach(c => counts.set(c.name, (counts.get(c.name) || 0) + 1)));
    } else {
      currentVictims.forEach(v => { if (v.country) counts.set(v.country, (counts.get(v.country) || 0) + 1); });
    }
    const countries = [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([n]) => n);
    select.innerHTML = `<option value="all">all countries</option>` + countries.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)} (${counts.get(c)})</option>`).join("");
    select.value = countries.includes(prev) ? prev : "all";
    filters.country = select.value;
  }

  function render() {
    if (currentView === "groups") renderGroups(); else renderVictims();
  }

  function renderVictims() {
    const term = filters.search.trim().toLowerCase();
    const filtered = currentVictims.filter(v => {
      if (filters.group !== "all" && v.group !== filters.group) return false;
      if (filters.sector !== "all" && v.sector !== filters.sector) return false;
      if (filters.country !== "all" && v.country !== filters.country) return false;
      if (term && !`${v.victim} ${v.description}`.toLowerCase().includes(term)) return false;
      return true;
    });

    document.getElementById("result-count").textContent =
      `showing ${filtered.length} of ${currentVictims.length} victim postings${currentMonth === "latest" ? " (most recent)" : ` (${currentMonth})`}`;

    const feed = document.getElementById("feed");
    if (filtered.length === 0) { feed.innerHTML = `<div class="empty-state">No postings match the current filters.</div>`; return; }

    feed.innerHTML = "";
    for (const v of filtered) {
      const el = document.createElement("button");
      el.className = "entry victim";
      el.innerHTML = `
        <div class="meta">
          <span class="tag">${escapeHtml(v.group)}</span>
          ${v.sector ? `<span>${escapeHtml(v.sector)}</span>` : ""}
          ${v.country ? `<span>${escapeHtml(v.country)}</span>` : ""}
          <span>${(v.published || "").slice(0, 10)}</span>
        </div>
        <h2>${escapeHtml(v.victim)}</h2>
        <p>${escapeHtml((v.description || "").slice(0, 200))}${(v.description || "").length > 200 ? "…" : ""}</p>
      `;
      el.addEventListener("click", () => openVictimFlyout(v));
      feed.appendChild(el);
    }
  }

  function renderGroups() {
    const term = filters.search.trim().toLowerCase();
    let filtered = groupsData.groups.filter(g => {
      if (filters.group !== "all" && g.name !== filters.group) return false;
      if (filters.country !== "all" && !(g.countries || []).some(c => c.name === filters.country)) return false;
      if (filters.raas === "yes" && !g.raas) return false;
      if (filters.raas === "no" && g.raas) return false;
      if (filters.active === "yes" && !g.is_active) return false;
      if (filters.active === "no" && g.is_active) return false;
      if (filters.negotiation === "yes" && !(g.negotiation && g.negotiation.available)) return false;
      if (filters.negotiation === "no" && g.negotiation && g.negotiation.available) return false;
      if (term && !`${g.name} ${g.description}`.toLowerCase().includes(term)) return false;
      return true;
    });

    if (filters.sort === "victims") {
      filtered = [...filtered].sort((a, b) => (b.total_victims || 0) - (a.total_victims || 0));
    }

    document.getElementById("result-count").textContent = `showing ${filtered.length} of ${groupsData.groups.length} tracked groups`;

    const feed = document.getElementById("feed");
    if (filtered.length === 0) { feed.innerHTML = `<div class="empty-state">No groups match the current filters.</div>`; return; }

    feed.innerHTML = "";
    for (const g of filtered) {
      const el = document.createElement("button");
      el.className = "entry group";
      const negotiation = g.negotiation || {};
      el.innerHTML = `
        <div class="meta">
          <span class="tag">GROUP</span>
          ${g.raas ? `<span class="raas-badge">RaaS</span>` : ""}
          <span class="${g.is_active ? "active-badge" : "inactive-badge"}">${g.is_active ? "active" : "inactive"}</span>
          ${negotiation.available ? `<span class="nego-badge">${negotiation.chat_count} negotiation chat${negotiation.chat_count === 1 ? "" : "s"}</span>` : ""}
          <span>${g.active_sites}/${g.total_sites} leak sites active</span>
          ${g.total_victims != null ? `<span>${g.total_victims} victims all-time</span>` : ""}
        </div>
        <h2>
          ${(g.countries || []).map(c => `<span class="flag-tag">${flagEmoji(c.code)}</span>`).join("")}
          ${escapeHtml(g.name)}${g.altname ? ` <span style="color:var(--text-dim); font-weight:400;">(${escapeHtml(g.altname)})</span>` : ""}
        </h2>
        <p>${escapeHtml(g.description || "No description on file.")}</p>
      `;
      el.addEventListener("click", () => openGroupFlyout(g));
      feed.appendChild(el);
    }
  }

  function openVictimFlyout(v) {
    const group = groupByName(v.group);
    document.getElementById("flyout-body").innerHTML = `
      <div class="fid">${escapeHtml(v.group.toUpperCase())}</div>
      <h2>${escapeHtml(v.victim)}</h2>
      <p class="flyout-summary">${escapeHtml(v.description) || "No description available."}</p>
      <div class="meta-grid">
        <div class="meta-cell"><span>Published</span><b>${(v.published || "—").slice(0, 10)}</b></div>
        <div class="meta-cell"><span>Sector</span><b>${escapeHtml(v.sector || "Unknown")}</b></div>
        <div class="meta-cell"><span>Country</span><b>${escapeHtml(v.country || "Unknown")}</b></div>
        <div class="meta-cell"><span>Group</span><b>${escapeHtml(v.group)}</b></div>
      </div>
      ${group ? `<a class="group-link" id="view-group-link">view ${escapeHtml(group.name)} group profile ›</a>` : ""}
      <div class="section-title">Links (read-only — not clickable)</div>
      <div class="ref-list">
        ${v.website ? `<div class="ref-text">${escapeHtml(v.website)}</div>` : ""}
        ${v.post_url ? `<div class="ref-text">${escapeHtml(v.post_url)}</div>` : ""}
        ${!v.website && !v.post_url ? `<span style="color:var(--text-dim); font-size:12px;">none recorded</span>` : ""}
      </div>
    `;
    openFlyout();
    if (group) document.getElementById("view-group-link").addEventListener("click", () => { closeFlyout(); openGroupFlyout(group); });
  }

  function openGroupFlyout(g) {
    const negotiation = g.negotiation || {};
    const origin = (g.countries || []).length
      ? g.countries.map(c => `${flagEmoji(c.code)} ${escapeHtml(c.name)}`).join(", ")
      : "Unattributed";
    document.getElementById("flyout-body").innerHTML = `
      <div class="fid">RANSOMWARE GROUP${g.raas ? " · RaaS" : ""}</div>
      <h2>${escapeHtml(g.name)}${g.altname ? ` (${escapeHtml(g.altname)})` : ""}</h2>
      <p class="flyout-summary">${escapeHtml(g.description) || "No description available."}</p>
      <div class="meta-grid">
        <div class="meta-cell"><span>Origin (best-effort)</span><b>${origin}</b></div>
        <div class="meta-cell"><span>Status</span><b>${g.is_active ? "Active" : "Inactive"}</b></div>
        <div class="meta-cell"><span>Leak sites tracked</span><b>${g.total_sites}</b></div>
        <div class="meta-cell"><span>Currently active</span><b>${g.active_sites}</b></div>
        <div class="meta-cell"><span>First seen</span><b>${escapeHtml(g.first_seen || "Unknown")}</b></div>
        <div class="meta-cell"><span>Victims all-time</span><b>${g.total_victims != null ? g.total_victims : "Unknown"}</b></div>
      </div>
      <div class="section-title">Negotiation transcripts</div>
      ${negotiation.available ? `
        <div style="font-size:12px; color:var(--text-dim); margin-bottom:6px;">${negotiation.chat_count} leaked negotiation chat${negotiation.chat_count === 1 ? "" : "s"} on file (Ransomchats archive)</div>
        ${negotiation.latest_chat_url ? `
          <a class="nego-link" href="${negotiationHref(g, negotiation.latest_chat_url, "latest")}">
            ▶ play latest negotiation
            <span class="nl-sub">${escapeHtml(negotiation.latest_chat_date || "date unknown")}</span>
          </a>` : ""}
        ${negotiation.longest_chat_url ? `
          <a class="nego-link" href="${negotiationHref(g, negotiation.longest_chat_url, "longest")}">
            ▶ play longest negotiation
            <span class="nl-sub">${negotiation.longest_chat_message_count} messages</span>
          </a>` : ""}
        ${(negotiation.chats || []).length ? `
          <div style="font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:14px; margin-bottom:2px;">
            Full archive · most recent first
          </div>
          <div class="nego-archive-list">
            ${negotiation.chats.map(c => `
              <a class="nego-archive-row" href="${negotiationHref(g, c.raw_url, c.date || "archive")}">
                <span class="nar-date">${escapeHtml(c.date || "date unknown")}</span>
                <span class="nar-count">${c.message_count} msg${c.message_count === 1 ? "" : "s"} ▶</span>
              </a>
            `).join("")}
          </div>
        ` : ""}
      ` : `<span style="color:var(--text-dim); font-size:12px;">none on file</span>`}
    `;
    openFlyout();
  }

  // Internal navigation to our own Spotlight page, not the external transcript
  // itself — spotlight.html fetches the raw_url client-side to populate the
  // chat replay, so this is a same-app link, not an outbound one.
  function negotiationHref(g, chatUrl, label) {
    const p = new URLSearchParams();
    p.set("mode", "negotiation");
    p.set("group", g.name);
    p.set("chat", chatUrl);
    p.set("label", label);
    p.set("from", `leaktracker.html?group=${encodeURIComponent(g.name)}`);
    p.set("fromName", g.name);
    return `spotlight.html?${p.toString()}`;
  }

  function openFlyout() {
    document.getElementById("flyout").classList.add("open");
    document.getElementById("flyout-backdrop").classList.add("open");
  }
  function closeFlyout() {
    document.getElementById("flyout").classList.remove("open");
    document.getElementById("flyout-backdrop").classList.remove("open");
  }

  init();
})();
</script>
</body>
</html>
