<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE SIGNAL — Dashboard</title>
<style>
  :root {
    --ink: #0a0e14;
    --ink-raised: #10151d;
    --ink-input: #0d1219;
    --line: #1e2733;
    --text: #d7dde5;
    --text-dim: #7d8998;
    --amber: #ffb020;
    --red: #ff5c5c;
    --blue: #5ac8ff;
    --green: #4fd58a;
    --purple: #c792ea;
    --teal: #2dd4bf;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .frame { max-width: 1400px; margin: 0 auto; padding: 24px 20px 80px; }

  header.masthead {
    border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
  }
  .masthead h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 4px; }
  .masthead .tagline { font-size: 12px; color: var(--text-dim); margin: 0 0 6px; }
  .masthead .sub { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); }
  .masthead nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .masthead nav a {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--line); padding: 6px 10px;
  }
  .masthead nav a:hover { color: var(--amber); border-color: var(--amber); }

  /* ---------- hero stat strip ---------- */
  .hero-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line);
    border: 1px solid var(--line); margin-bottom: 20px;
  }
  @media (min-width: 1000px) { .hero-grid { grid-template-columns: repeat(8, 1fr); } }
  .stat-card {
    background: var(--ink-raised); padding: 14px 14px 12px; text-decoration: none; color: var(--text);
    display: flex; flex-direction: column; gap: 4px; transition: background 0.15s ease;
  }
  .stat-card:hover { background: #141b26; }
  .stat-card .sc-value { font-family: var(--font-sans); font-size: 24px; font-weight: 700; line-height: 1.1; }
  .stat-card .sc-value.dim { color: var(--text-dim); font-size: 16px; }
  .stat-card .sc-label {
    font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);
  }

  /* ---------- main grid ---------- */
  .dash-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .panel {
    grid-column: span 12; background: var(--ink-raised); border: 1px solid var(--line); padding: 16px 18px;
    min-width: 0;
  }
  @media (min-width: 760px) {
    .panel.span-4 { grid-column: span 6; }
    .panel.span-6 { grid-column: span 6; }
    .panel.span-8 { grid-column: span 8; }
    .panel.span-12 { grid-column: span 12; }
  }
  @media (min-width: 1100px) {
    .panel.span-4 { grid-column: span 4; }
    .panel.span-6 { grid-column: span 6; }
    .panel.span-8 { grid-column: span 8; }
  }

  .panel h3 {
    font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin: 0 0 4px; font-weight: 500;
  }
  .panel .panel-sub {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); opacity: 0.8; margin-bottom: 14px;
  }
  .panel .empty-note { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); padding: 10px 0; }

  /* bar rows (clickable) */
  .bar-row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11.5px; margin-bottom: 8px; padding: 3px 0;
    text-decoration: none; color: var(--text); background: none; border: none; width: 100%; text-align: left; cursor: pointer;
  }
  .bar-row.disabled { cursor: default; }
  .bar-row:not(.disabled):hover .bl-label { color: var(--amber); }
  .bar-row .bl-label { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
  .bar-row .bl-count { color: var(--text-dim); flex: 0 0 auto; }
  .bar-row .bl-track-wrap { grid-column: 1 / -1; }
  .bar-track { height: 6px; background: rgba(255,255,255,0.06); position: relative; margin-top: 4px; }
  .bar-fill { height: 100%; }
  .bar-fill.critical { background: var(--red); }
  .bar-fill.high { background: var(--amber); }
  .bar-fill.kev { background: var(--purple); }
  .bar-fill.amber { background: var(--amber); }
  .bar-fill.green { background: var(--green); }
  .bar-fill.blue { background: var(--blue); }
  .bar-fill.teal { background: var(--teal); }
  .bar-fill.purple { background: var(--purple); }

  /* compact list rows */
  .list-row {
    display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line);
    text-decoration: none; color: var(--text);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row:hover { color: var(--amber); }
  .list-row .lr-meta {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); display: flex; gap: 8px; flex-wrap: wrap;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .list-row:hover .lr-meta { color: var(--text-dim); }
  .list-row .lr-title { font-size: 13px; line-height: 1.4; }
  .badge {
    font-size: 9px; padding: 1px 6px; border: 1px solid currentColor; letter-spacing: 0.05em;
  }
  .badge.critical { color: var(--red); }
  .badge.high { color: var(--amber); }
  .badge.kev { color: var(--purple); }
  .badge.raas { color: var(--amber); }
  .badge.active { color: var(--green); }

  /* donut */
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut { width: 92px; height: 92px; border-radius: 50%; flex: 0 0 auto; }
  .donut-legend { display: flex; flex-direction: column; gap: 6px; font-family: var(--font-mono); font-size: 11px; }
  .donut-legend .dl-row { display: flex; align-items: center; gap: 7px; }
  .donut-legend .dl-dot { width: 9px; height: 9px; flex: 0 0 auto; }

  /* countries mini-columns */
  .country-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 700px) { .country-cols { grid-template-columns: 1fr; } }
  .country-cols h4 {
    font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); margin: 0 0 8px;
  }
  .country-row {
    display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 4px 0;
    text-decoration: none; color: var(--text);
  }
  .country-row:hover { color: var(--amber); }
  .country-row .cr-count { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }

  /* month sparkline (trend) */
  .trend-bar-wrap { display: flex; align-items: flex-end; gap: 3px; height: 64px; }
  .trend-bar { flex: 1; background: var(--amber); opacity: 0.8; min-height: 2px; }
  .trend-labels { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); margin-top: 6px; }

  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="frame">
    <header class="masthead">
      <div>
        <h1>THE SIGNAL — DASHBOARD</h1>
        <div class="tagline">Cross-dataset situational overview — click any figure to drill into its source.</div>
        <div class="sub" id="status-line">loading…</div>
      </div>
      <nav>
        <a href="index.html">‹ feed</a>
        <a href="attack.html">‹ ATT&amp;CK</a>
        <a href="cve.html">‹ CVE</a>
        <a href="leaktracker.html">‹ ransomware</a>
        <a href="spotlight.html">‹ spotlight</a>
      </nav>
    </header>

    <div class="hero-grid" id="hero-grid"></div>

    <div class="dash-grid" id="dash-grid"></div>
  </div>

<script>
(() => {
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function flagEmoji(code) {
    if (!code || code.length !== 2) return "🏳";
    return [...code.toUpperCase()].map(c => String.fromCodePoint(127397 + c.charCodeAt(0))).join("");
  }

  function fmt(n) {
    return n == null ? "—" : n.toLocaleString();
  }

  async function loadJson(path) {
    const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function safeLoad(path) {
    try { return await loadJson(path); } catch (err) { console.error(`dashboard: failed to load ${path}`, err); return null; }
  }

  async function loadAll() {
    const [threats, attack, cveIndex, cveLatest, ltGroups, ltLatest, ltIndex] = await Promise.all([
      safeLoad("data/threats.json"),
      safeLoad("data/attack/enterprise.json"),
      safeLoad("data/cve/index.json"),
      safeLoad("data/cve/latest.json"),
      safeLoad("data/leaktracker/groups.json"),
      safeLoad("data/leaktracker/latest.json"),
      safeLoad("data/leaktracker/index.json"),
    ]);
    return { threats, attack, cveIndex, cveLatest, ltGroups, ltLatest, ltIndex };
  }

  // ---------- aggregation helpers ----------

  function sumMonths(index, key) {
    if (!index) return null;
    return index.months.reduce((s, m) => s + (m[key] || 0), 0);
  }

  function topVendors(cves, n) {
    const counts = new Map();
    (cves || []).forEach(c => (c.vendors || []).forEach(v => counts.set(v, (counts.get(v) || 0) + 1)));
    return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, n);
  }

  function tacticCoverage(attack) {
    const counts = new Map(attack.tactics.map(t => [t.id, 0]));
    attack.techniques.forEach(t => (t.tactics || []).forEach(tid => { if (counts.has(tid)) counts.set(tid, counts.get(tid) + 1); }));
    return attack.tactics
      .map(t => ({ id: t.id, name: t.name, count: counts.get(t.id) || 0 }))
      .sort((a, b) => b.count - a.count);
  }

  function topGroupsByTechniques(attack, n) {
    return [...attack.groups].sort((a, b) => (b.techniques || []).length - (a.techniques || []).length).slice(0, n);
  }

  function topRansomwareGroups(ltGroups, n) {
    return [...ltGroups.groups].filter(g => g.total_victims != null)
      .sort((a, b) => (b.total_victims || 0) - (a.total_victims || 0)).slice(0, n);
  }

  function countryCounts(list, getCountries) {
    const counts = new Map();
    list.forEach(item => (getCountries(item) || []).forEach(c => {
      const key = `${c.code}|${c.name}`;
      counts.set(key, (counts.get(key) || 0) + 1);
    }));
    return [...counts.entries()]
      .map(([k, v]) => { const [code, name] = k.split("|"); return { code, name, count: v }; })
      .sort((a, b) => b.count - a.count);
  }

  function victimCountryCounts(victims) {
    const counts = new Map();
    victims.forEach(v => { if (v.country) counts.set(v.country, (counts.get(v.country) || 0) + 1); });
    return [...counts.entries()].map(([code, count]) => ({ code, count })).sort((a, b) => b.count - a.count);
  }

  // ---------- render: hero stats ----------

  function renderHero(d) {
    const feedCount = d.threats ? d.threats.entries.length : null;
    const groupCount = d.attack ? d.attack.groups.length : null;
    const techniqueCount = d.attack ? d.attack.techniques.length : null;
    const cveTotal = sumMonths(d.cveIndex, "count");
    const kevTotal = sumMonths(d.cveIndex, "kev");
    const rGroupCount = d.ltGroups ? d.ltGroups.groups.length : null;
    const activeCount = d.ltGroups ? d.ltGroups.groups.filter(g => g.is_active).length : null;
    const victimTotal = sumMonths(d.ltIndex, "count");

    const stats = [
      { label: "Feed items", value: feedCount, href: "index.html" },
      { label: "APT groups", value: groupCount, href: "attack.html?domain=enterprise&type=groups" },
      { label: "ATT&CK techniques", value: techniqueCount, href: "attack.html?domain=enterprise&type=techniques" },
      { label: "CVEs tracked", value: cveTotal, href: "cve.html" },
      { label: "Known exploited (KEV)", value: kevTotal, href: "cve.html?kev=1" },
      { label: "Ransomware groups", value: rGroupCount, href: "leaktracker.html?view=groups" },
      { label: "Active leak sites", value: activeCount, href: "leaktracker.html?view=groups&active=yes" },
      { label: "Victims logged", value: victimTotal, href: "leaktracker.html" },
    ];

    document.getElementById("hero-grid").innerHTML = stats.map(s => `
      <a class="stat-card" href="${s.href}">
        <span class="sc-value${s.value == null ? " dim" : ""}">${s.value == null ? "n/a" : fmt(s.value)}</span>
        <span class="sc-label">${escapeHtml(s.label)}</span>
      </a>
    `).join("");

    const parts = [];
    if (d.threats) parts.push(`feed fetched ${new Date(d.threats.fetched_at).toLocaleString()}`);
    if (d.cveIndex) parts.push(`CVEs fetched ${new Date(d.cveIndex.last_fetched).toLocaleString()}`);
    if (d.ltIndex) parts.push(`leak-tracker fetched ${new Date(d.ltIndex.last_fetched).toLocaleString()}`);
    document.getElementById("status-line").textContent = parts.join(" · ") || "some data sources unavailable";
  }

  // ---------- render: panel builders ----------

  function panel(title, sub, bodyHtml, spanClass) {
    return `<div class="panel ${spanClass}">
      <h3>${escapeHtml(title)}</h3>
      ${sub ? `<div class="panel-sub">${sub}</div>` : ""}
      ${bodyHtml}
    </div>`;
  }

  function barRow(label, count, max, fillClass, href) {
    const pct = max > 0 ? Math.max(2, (count / max) * 100) : 0;
    const tag = href ? "a" : "div";
    return `<${tag} class="bar-row${href ? "" : " disabled"}" ${href ? `href="${href}"` : ""}>
      <span class="bl-label">${label}</span>
      <span class="bl-count">${fmt(count)}</span>
      <div class="bl-track-wrap"><div class="bar-track"><div class="bar-fill ${fillClass}" style="width:${pct.toFixed(0)}%"></div></div></div>
    </${tag}>`;
  }

  function renderCveSeverityPanel(d) {
    if (!d.cveIndex) return panel("CVE severity", null, `<div class="empty-note">CVE data unavailable.</div>`, "span-4");
    const critical = sumMonths(d.cveIndex, "critical");
    const high = sumMonths(d.cveIndex, "high");
    const kev = sumMonths(d.cveIndex, "kev");
    const max = Math.max(critical, high, 1);
    const body = `
      ${barRow("Critical", critical, max, "critical", "cve.html?severity=CRITICAL")}
      ${barRow("High", high, max, "high", "cve.html?severity=HIGH")}
      ${barRow("Known Exploited (KEV)", kev, max, "kev", "cve.html?kev=1")}
    `;
    return panel("CVE severity", `Critical &amp; High severity CVEs on record, plus CISA KEV overlap`, body, "span-4");
  }

  function renderTopVendorsPanel(d) {
    if (!d.cveLatest) return panel("Top affected vendors / products", null, `<div class="empty-note">CVE data unavailable.</div>`, "span-4");
    const vendors = topVendors(d.cveLatest.cves, 10);
    if (vendors.length === 0) return panel("Top affected vendors / products", null, `<div class="empty-note">No vendor data in the current sample.</div>`, "span-4");
    const max = vendors[0][1];
    const body = vendors.map(([name, count]) => barRow(escapeHtml(name), count, max, "blue", `cve.html?vendor=${encodeURIComponent(name)}`)).join("");
    return panel("Top affected vendors / products", `From the ${d.cveLatest.cves.length} most recent &amp; severe CVEs`, body, "span-4");
  }

  function renderTopCvesPanel(d) {
    if (!d.cveLatest) return panel("Top CVEs", null, `<div class="empty-note">CVE data unavailable.</div>`, "span-4");
    const cves = d.cveLatest.cves.slice(0, 8);
    const body = cves.map(c => {
      const sev = (c.cvss && c.cvss.severity) || "UNRATED";
      const score = c.cvss ? c.cvss.score.toFixed(1) : "—";
      return `<a class="list-row" href="cve.html?search=${encodeURIComponent(c.id)}">
        <div class="lr-meta">
          <span class="badge ${sev.toLowerCase()}">${sev}</span>
          <span>CVSS ${score}</span>
          ${c.kev && c.kev.in_kev ? `<span class="badge kev">KEV</span>` : ""}
        </div>
        <div class="lr-title">${escapeHtml(c.id)} — ${escapeHtml((c.description || "").slice(0, 90))}${(c.description || "").length > 90 ? "…" : ""}</div>
      </a>`;
    }).join("");
    return panel("Top CVEs", `Most severe / recently modified`, body, "span-4");
  }

  function renderCveTrendPanel(d) {
    if (!d.cveIndex) return panel("CVE volume — last 12 months", null, `<div class="empty-note">CVE data unavailable.</div>`, "span-12");
    const months = [...d.cveIndex.months].sort((a, b) => a.key.localeCompare(b.key)).slice(-12);
    const max = Math.max(1, ...months.map(m => m.count));
    const bars = months.map(m => `<div class="trend-bar" style="height:${Math.max(4, (m.count / max) * 100)}%" title="${escapeHtml(m.key)}: ${m.count} CVEs"></div>`).join("");
    const labels = months.map(m => `<span>${escapeHtml(m.key.slice(5))}</span>`).join("");
    return panel("CVE volume — last 12 months", null, `<div class="trend-bar-wrap">${bars}</div><div class="trend-labels">${labels}</div>`, "span-12");
  }

  function renderTacticPanel(d) {
    if (!d.attack) return panel("ATT&CK — techniques per tactic (Enterprise)", null, `<div class="empty-note">ATT&amp;CK data unavailable.</div>`, "span-8");
    const rows = tacticCoverage(d.attack);
    const max = Math.max(1, ...rows.map(r => r.count));
    const body = rows.map(r => barRow(escapeHtml(r.name), r.count, max, "green", `attack.html?domain=enterprise&type=tactics&id=${encodeURIComponent(r.id)}`)).join("");
    const sub = `${d.attack.groups.length} groups · ${d.attack.techniques.length} techniques · ${d.attack.software.length} software · ${d.attack.campaigns.length} campaigns · ${d.attack.mitigations.length} mitigations (Enterprise domain)`;
    return panel("ATT&CK — techniques per tactic", sub, body, "span-8");
  }

  function renderTopAptGroupsPanel(d) {
    if (!d.attack) return panel("Top APT groups by technique coverage", null, `<div class="empty-note">ATT&amp;CK data unavailable.</div>`, "span-4");
    const groups = topGroupsByTechniques(d.attack, 10);
    const max = Math.max(1, ...groups.map(g => (g.techniques || []).length));
    const body = groups.map(g => barRow(
      escapeHtml(g.name), (g.techniques || []).length, max, "purple",
      `attack.html?domain=enterprise&type=groups&id=${encodeURIComponent(g.id)}`
    )).join("");
    return panel("Top APT groups by technique coverage", "Enterprise domain", body, "span-4");
  }

  function renderRansomwarePanel(d) {
    if (!d.ltGroups) return panel("Ransomware groups", null, `<div class="empty-note">Leak-tracker data unavailable.</div>`, "span-8");
    const groups = d.ltGroups.groups;
    const raasCount = groups.filter(g => g.raas).length;
    const negoCount = groups.filter(g => g.negotiation && g.negotiation.available).length;
    const activeCount = groups.filter(g => g.is_active).length;
    const top = topRansomwareGroups(d.ltGroups, 8);
    const max = Math.max(1, ...top.map(g => g.total_victims || 0));
    const chips = `
      <div class="panel-sub" style="margin-bottom:12px;">
        <a href="leaktracker.html?view=groups" style="color:var(--text-dim);">${groups.length} tracked</a> ·
        <a href="leaktracker.html?view=groups&active=yes" style="color:var(--green);">${activeCount} active</a> ·
        <a href="leaktracker.html?view=groups&raas=yes" style="color:var(--amber);">${raasCount} RaaS</a> ·
        <a href="leaktracker.html?view=groups&negotiations=yes" style="color:var(--purple);">${negoCount} with leaked negotiations</a>
      </div>`;
    const body = top.map(g => barRow(escapeHtml(g.name), g.total_victims || 0, max, "amber", `leaktracker.html?group=${encodeURIComponent(g.name)}`)).join("");
    return panel("Ransomware groups — top by victim count", chips, body, "span-8");
  }

  function renderLatestVictimsPanel(d) {
    if (!d.ltLatest) return panel("Latest leak-site postings", null, `<div class="empty-note">Leak-tracker data unavailable.</div>`, "span-4");
    const victims = d.ltLatest.victims.slice(0, 8);
    const body = victims.map(v => `
      <a class="list-row" href="leaktracker.html?group=${encodeURIComponent(v.group)}">
        <div class="lr-meta">
          <span>${escapeHtml(v.group)}</span>
          ${v.country ? `<span>${flagEmoji(v.country)} ${escapeHtml(v.country)}</span>` : ""}
          <span>${escapeHtml((v.published || "").slice(0, 10))}</span>
        </div>
        <div class="lr-title">${escapeHtml(v.victim)}</div>
      </a>
    `).join("");
    return panel("Latest leak-site postings", null, body, "span-4");
  }

  function renderNewsPanel(d) {
    if (!d.threats) return panel("Latest news headlines", null, `<div class="empty-note">Feed data unavailable.</div>`, "span-4");
    const entries = d.threats.entries.slice(0, 8);
    const body = entries.map(e => `
      <a class="list-row" href="${escapeHtml(e.link)}" target="_blank" rel="noopener noreferrer">
        <div class="lr-meta">
          <span class="badge ${(e.severity || "").toLowerCase()}">${escapeHtml(e.severity || "info")}</span>
          <span>${escapeHtml(e.source || "")}</span>
        </div>
        <div class="lr-title">${escapeHtml(e.title)}</div>
      </a>
    `).join("");
    return panel("Latest news headlines", null, body, "span-4");
  }

  function renderCountriesPanel(d) {
    const cols = [];

    if (d.attack) {
      const rows = countryCounts(d.attack.groups, g => g.countries).slice(0, 8);
      cols.push({
        title: "APT actor origin (ATT&CK)",
        rows: rows.map(r => ({
          label: `${flagEmoji(r.code)} ${escapeHtml(r.name)}`, count: r.count,
          href: `attack.html?domain=enterprise&country=${encodeURIComponent(r.code)}&countryName=${encodeURIComponent(r.name)}`,
        })),
      });
    }
    if (d.ltGroups) {
      const rows = countryCounts(d.ltGroups.groups, g => g.countries).slice(0, 8);
      cols.push({
        title: "Ransomware actor origin",
        rows: rows.map(r => ({
          label: `${flagEmoji(r.code)} ${escapeHtml(r.name)}`, count: r.count,
          href: `leaktracker.html?view=groups&country=${encodeURIComponent(r.name)}`,
        })),
      });
    }
    if (d.ltLatest) {
      const rows = victimCountryCounts(d.ltLatest.victims).slice(0, 8);
      cols.push({
        title: "Recent victim / target countries",
        rows: rows.map(r => ({
          label: `${flagEmoji(r.code)} ${escapeHtml(r.code)}`, count: r.count,
          href: `leaktracker.html?country=${encodeURIComponent(r.code)}`,
        })),
      });
    }

    if (cols.length === 0) return panel("Countries covered", null, `<div class="empty-note">No data available.</div>`, "span-8");

    const body = `<div class="country-cols">` + cols.map(col => `
      <div>
        <h4>${escapeHtml(col.title)}</h4>
        ${col.rows.length === 0 ? `<div class="empty-note">No attributions on file.</div>` :
          col.rows.map(r => `<a class="country-row" href="${r.href}"><span>${r.label}</span><span class="cr-count">${fmt(r.count)}</span></a>`).join("")}
      </div>
    `).join("") + `</div>`;

    return panel(
      "Countries covered",
      "Actor-origin attributions are best-effort text inference, kept separate from victim/target location so the two are never conflated.",
      body, "span-8",
    );
  }

  // ---------- boot ----------

  async function init() {
    const d = await loadAll();
    renderHero(d);

    const panels = [
      renderCveSeverityPanel(d),
      renderTopVendorsPanel(d),
      renderTopCvesPanel(d),
      renderTacticPanel(d),
      renderTopAptGroupsPanel(d),
      renderRansomwarePanel(d),
      renderLatestVictimsPanel(d),
      renderCountriesPanel(d),
      renderNewsPanel(d),
      renderCveTrendPanel(d),
    ];
    document.getElementById("dash-grid").innerHTML = panels.join("");
  }

  init();
})();
</script>
</body>
</html>
