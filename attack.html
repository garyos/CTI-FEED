<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — ATT&amp;CK Explorer</title>
<style>
  :root {
    --ink: #0a0e14;
    --ink-raised: #10151d;
    --ink-input: #0d1219;
    --line: #1e2733;
    --text: #d7dde5;
    --text-dim: #7d8998;
    --amber: #ffb020;
    --red: #ff5c5c;
    --blue: #5ac8ff;
    --green: #4fd58a;
    --purple: #c792ea;
    --teal: #2dd4bf;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans: "Space Grotesk", "Inter", system-ui, sans-serif;
  }

  /* entity-type categorical colors, distinct from severity semantics elsewhere on the site */
  :root {
    --c-groups: var(--amber);
    --c-tactics: var(--teal);
    --c-techniques: var(--blue);
    --c-software: var(--purple);
    --c-campaigns: var(--red);
    --c-mitigations: var(--green);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    overscroll-behavior-y: none;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .frame {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  header.masthead {
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  .masthead h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 4px; }
  .masthead .sub { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .masthead nav a {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim);
    text-decoration: none; border: 1px solid var(--line); padding: 6px 10px;
  }
  .masthead nav a:hover { color: var(--amber); border-color: var(--amber); }

  /* domain switcher */
  .domain-switcher {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line); margin-bottom: 10px;
  }
  .domain-btn {
    background: var(--ink-raised); color: var(--text-dim); border: none;
    font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.04em;
    padding: 11px 6px; cursor: pointer; text-transform: uppercase;
  }
  .domain-btn.active { background: var(--ink); color: var(--amber); font-weight: 600; }
  .domain-btn:disabled { opacity: 0.4; cursor: wait; }

  /* entity tabs */
  .entity-tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px;
    scrollbar-width: thin;
  }
  .entity-tab {
    flex: 0 0 auto; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.03em;
    color: var(--text-dim); background: var(--ink-raised); border: 1px solid var(--line);
    padding: 8px 12px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .entity-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.5; }
  .entity-tab.active { color: var(--tab-color, var(--amber)); border-color: var(--tab-color, var(--amber)); }
  .entity-tab.active .dot { opacity: 1; }

  .view-toggle { display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .view-toggle button {
    background: var(--ink-raised); color: var(--text-dim); border: none;
    font-family: var(--font-mono); font-size: 11px; padding: 7px 10px; cursor: pointer;
  }
  .view-toggle button.active { background: var(--ink); color: var(--amber); }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .toolbar input {
    flex: 1; min-width: 160px; font-family: var(--font-mono); font-size: 12.5px; padding: 10px 12px;
    background: var(--ink-input); color: var(--text); border: 1px solid var(--line);
  }
  .toolbar input::placeholder { color: var(--text-dim); }
  .reset-btn {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); background: none;
    border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; white-space: nowrap;
  }
  .reset-btn:hover { color: var(--amber); border-color: var(--amber); }

  .active-filter {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px;
    color: var(--amber); border: 1px solid var(--amber); padding: 5px 9px; margin-bottom: 10px; cursor: pointer;
  }

  .stat-line { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin: 10px 0 16px; }

  /* card grid, generic across entity types */
  .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card {
    background: var(--ink-raised); border: 1px solid var(--line);
    border-left: 3px solid var(--card-color, var(--amber));
    padding: 12px 14px; cursor: pointer; text-align: left; color: var(--text);
    font-family: var(--font-sans); width: 100%;
    transition: background 0.15s ease;
  }
  .card:hover, .card:focus-visible { background: #141b26; }
  .card .cid { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em; }
  .card .cname { font-size: 15px; font-weight: 600; margin: 3px 0 5px; }
  .card .csub {
    font-size: 12px; color: var(--text-dim); line-height: 1.4; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .cstats { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-bottom: 6px; }
  .card .cstats b { color: var(--text); }
  .card .cflags { font-size: 12px; margin-bottom: 6px; }
  .card .ctag {
    display: inline-block; font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase;
    color: var(--text-dim); border: 1px solid var(--line); padding: 1px 6px; margin-right: 6px;
  }

  .coverage-bar { display: flex; gap: 2px; height: 5px; }
  .coverage-seg { flex: 1; background: rgba(255,255,255,0.08); }
  .coverage-seg.filled { background: var(--amber); }

  .empty-state {
    font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); padding: 40px 0;
    text-align: center; border: 1px dashed var(--line);
  }

  /* country cloud */
  .country-cloud { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 0; }
  .country-chip {
    font-family: var(--font-mono); color: var(--text); background: var(--ink-raised);
    border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; line-height: 1.3;
  }
  .country-chip:hover { border-color: var(--amber); }
  .country-chip .n { color: var(--text-dim); font-size: 0.75em; }
  .country-chip.unattributed { opacity: 0.6; font-style: italic; }

  /* flyout */
  .flyout-backdrop {
    position: fixed; inset: 0; background: rgba(5,7,10,0.6); backdrop-filter: blur(1px);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 40;
  }
  .flyout-backdrop.open { opacity: 1; pointer-events: auto; }

  .flyout {
    position: fixed; background: var(--ink-raised); border-left: 1px solid var(--line);
    z-index: 41; display: flex; flex-direction: column;
    top: 0; right: 0; bottom: 0; width: min(440px, 100%);
    transform: translateX(100%); transition: transform 0.25s ease;
  }
  .flyout.open { transform: translateX(0); }
  @media (max-width: 680px) {
    .flyout {
      top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 88vh;
      border-left: none; border-top: 1px solid var(--line);
      transform: translateY(100%);
    }
    .flyout.open { transform: translateY(0); }
  }

  .flyout-head {
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .flyout-close {
    font-family: var(--font-mono); font-size: 16px; color: var(--text-dim); background: none;
    border: none; cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .flyout-close:hover { color: var(--red); }
  .flyout-body { padding: 16px; overflow-y: auto; flex: 1 1 auto; }

  /* back/breadcrumb nav lives at the bottom — thumb-reachable on mobile */
  .flyout-nav {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-top: 1px solid var(--line); background: var(--ink-raised);
  }
  .flyout-back {
    flex: 0 0 auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--text);
    background: var(--ink-input); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .flyout-back:hover:not(:disabled) { color: var(--amber); border-color: var(--amber); }
  .flyout-back:disabled { opacity: 0.3; cursor: default; }
  .flyout-crumbs {
    flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 5px;
    overflow-x: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
    scrollbar-width: none;
  }
  .flyout-crumbs::-webkit-scrollbar { display: none; }
  .flyout-crumbs button {
    flex: 0 0 auto; background: none; border: none; color: var(--text-dim); font-family: var(--font-mono);
    font-size: 11px; cursor: pointer; padding: 2px; white-space: nowrap; max-width: 110px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .flyout-crumbs button:last-child { color: var(--amber); cursor: default; }
  .flyout-crumbs button:not(:last-child):hover { color: var(--text); text-decoration: underline; }
  .flyout-crumbs .sep { flex: 0 0 auto; opacity: 0.5; }

  .flyout-body .fid {
    font-family: var(--font-mono); font-size: 11px; color: var(--card-color, var(--text-dim));
  }
  .flyout-body h2 { font-size: 20px; margin: 4px 0 8px; }
  .alias-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .alias-chip { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); border: 1px solid var(--line); padding: 3px 8px; }
  .flyout-summary { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); margin-bottom: 14px; white-space: pre-line; }
  .flyout-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-bottom: 14px; }

  .section-title {
    font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .technique-group { margin-bottom: 14px; }
  .technique-group h4 {
    font-family: var(--font-mono); font-size: 11px; color: var(--blue); margin: 0 0 8px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 5px 10px; background: var(--ink-input); border: 1px solid var(--line);
    color: var(--text); cursor: pointer; text-align: left;
  }
  .chip:hover { border-color: var(--chip-color, var(--amber)); color: var(--chip-color, var(--amber)); }

  .spotlight-btn {
    margin-top: 20px; width: 100%; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.04em;
    color: var(--ink); background: var(--amber); border: none; padding: 12px; cursor: pointer;
    text-transform: uppercase; font-weight: 600; text-align: center; text-decoration: none; display: block;
  }
  .spotlight-btn:hover { filter: brightness(1.1); }

  footer { margin-top: 32px; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
  a.footer-link { color: var(--text-dim); }
  a.footer-link:hover { color: var(--amber); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="frame">
    <header class="masthead">
      <div>
        <h1>ATT&amp;CK EXPLORER</h1>
        <div class="sub" id="domain-line">loading…</div>
      </div>
      <nav><a href="index.html">‹ feed</a></nav>
    </header>

    <div class="domain-switcher" id="domain-switcher">
      <button class="domain-btn" data-domain="enterprise">Enterprise</button>
      <button class="domain-btn" data-domain="mobile">Mobile</button>
      <button class="domain-btn" data-domain="ics">ICS</button>
    </div>

    <div class="entity-tabs" id="entity-tabs"></div>

    <div class="toolbar">
      <input id="search-input" type="text" placeholder="search…" />
      <div class="view-toggle" id="group-view-toggle" hidden>
        <button data-view="grid" class="active">grid</button>
        <button data-view="country">by country</button>
      </div>
      <button class="reset-btn" id="reset-btn">reset</button>
    </div>
    <div id="active-filter-slot"></div>
    <div class="stat-line" id="stat-line"></div>

    <div id="view-root">
      <div class="empty-state">Loading ATT&amp;CK data…</div>
    </div>

    <footer>
      MITRE ATT&amp;CK® data compacted from
      <a class="footer-link" href="https://github.com/mitre-attack/attack-stix-data" target="_blank" rel="noopener noreferrer">mitre-attack/attack-stix-data</a>
      by a scheduled GitHub Action · country tags are inferred from public descriptions, not authoritative ·
      <a class="footer-link" href="data/attack/enterprise.json">view raw enterprise data</a>
    </footer>
  </div>

  <div class="flyout-backdrop" id="flyout-backdrop"></div>
  <aside class="flyout" id="flyout">
    <div class="flyout-head">
      <button class="flyout-close" id="flyout-close">✕</button>
    </div>
    <div class="flyout-body" id="flyout-body"></div>
    <div class="flyout-nav">
      <button class="flyout-back" id="flyout-back">‹ back</button>
      <div class="flyout-crumbs" id="flyout-crumbs"></div>
    </div>
  </aside>

<script>
(() => {
  const DOMAINS = ["enterprise", "mobile", "ics"];
  const TYPES = ["groups", "techniques", "tactics", "software", "campaigns", "mitigations"];
  const TYPE_LABEL = { groups: "Groups", techniques: "Techniques", tactics: "Tactics", software: "Software", campaigns: "Campaigns", mitigations: "Mitigations" };
  const DOMAIN_KEY = "signal-attack-domain-v2";
  const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const cache = {};
  let currentDomain = localStorage.getItem(DOMAIN_KEY) || "enterprise";
  if (!DOMAINS.includes(currentDomain)) currentDomain = "enterprise";
  let currentType = "groups";
  let groupView = "grid";
  let searchTerm = "";
  let countryFilter = null; // {code, name} | {code:"__none__", name:"Unattributed"}
  let flyoutStack = []; // [{type, id}]

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function flagEmoji(code) {
    if (!code || code.length !== 2) return "🏳";
    return [...code.toUpperCase()].map(c => String.fromCodePoint(127397 + c.charCodeAt(0))).join("");
  }

  // ---------- data loading ----------

  async function loadDomain(domain) {
    if (cache[domain]) return cache[domain];
    const res = await fetch(`data/attack/${domain}.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    data.byId = {};
    for (const type of TYPES) {
      data.byId[type] = Object.fromEntries((data[type] || []).map(e => [e.id, e]));
    }
    cache[domain] = data;
    return data;
  }

  function getEntity(data, type, id) {
    return data.byId[type] && data.byId[type][id];
  }

  function techniquesForTactic(data, tacticId) {
    return data.techniques.filter(t => t.tactics.includes(tacticId));
  }

  function groupsUsingSoftware(data, softwareId) {
    return data.groups.filter(g => g.software.includes(softwareId));
  }

  function techniqueLabel(t, data) {
    if (t.parent && data.byId.techniques[t.parent]) {
      return `${data.byId.techniques[t.parent].name}: ${t.name}`;
    }
    return t.name;
  }

  // ---------- entity tabs / domain switcher ----------

  function renderTabs() {
    const el = document.getElementById("entity-tabs");
    el.innerHTML = TYPES.map(type => `
      <button class="entity-tab" data-type="${type}" style="--tab-color: var(--c-${type})">
        <span class="dot"></span>${TYPE_LABEL[type]}
      </button>
    `).join("");
    el.querySelectorAll(".entity-tab").forEach(btn => {
      btn.addEventListener("click", () => switchType(btn.dataset.type));
    });
    syncTabsActive();
  }

  function syncTabsActive() {
    document.querySelectorAll(".entity-tab").forEach(b => b.classList.toggle("active", b.dataset.type === currentType));
    document.getElementById("group-view-toggle").hidden = currentType !== "groups";
    document.querySelectorAll("#group-view-toggle button").forEach(b => b.classList.toggle("active", b.dataset.view === groupView));
    document.getElementById("search-input").placeholder =
      currentType === "groups" ? "search actor name or alias…" : `search ${TYPE_LABEL[currentType].toLowerCase()}…`;
  }

  function switchType(type) {
    if (type === currentType) return;
    currentType = type;
    searchTerm = "";
    countryFilter = null;
    document.getElementById("search-input").value = "";
    if (type !== "groups") groupView = "grid";
    closeFlyout();
    syncTabsActive();
    render();
  }

  async function switchDomain(domain) {
    currentDomain = domain;
    countryFilter = null;
    closeFlyout();
    localStorage.setItem(DOMAIN_KEY, domain);
    document.querySelectorAll(".domain-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.domain === domain);
      b.disabled = true;
    });
    document.getElementById("view-root").innerHTML = `<div class="empty-state">Loading ${escapeHtml(domain)} data…</div>`;
    try {
      const data = await loadDomain(domain);
      document.querySelectorAll(".domain-btn").forEach(b => b.disabled = false);
      document.getElementById("domain-line").textContent =
        `${data.name} · ${data.groups.length} groups · ${data.software.length} software · ${data.techniques.length} techniques · `
        + `${data.campaigns.length} campaigns · ${data.mitigations.length} mitigations · fetched ${new Date(data.fetched_at).toLocaleDateString()}`;
      render();
    } catch (err) {
      document.querySelectorAll(".domain-btn").forEach(b => b.disabled = false);
      document.getElementById("view-root").innerHTML =
        `<div class="empty-state">Couldn't load ${escapeHtml(domain)} data. Has scripts/fetch_attack.py been run yet?</div>`;
      console.error(err);
    }
  }

  // ---------- search / filtering ----------

  function matchesSearch(type, e, term) {
    if (!term) return true;
    const t = term.toLowerCase();
    if (e.name && e.name.toLowerCase().includes(t)) return true;
    if (e.id && e.id.toLowerCase().includes(t)) return true;
    if (e.aliases && e.aliases.some(a => a.toLowerCase().includes(t))) return true;
    return false;
  }

  // ---------- coverage bar (groups + techniques tactic membership) ----------

  function coverageBar(data, techniqueIds) {
    return `<div class="coverage-bar">` + data.tactics.map(t => {
      const has = techniqueIds.some(tid => (data.byId.techniques[tid]?.tactics || []).includes(t.id));
      return `<div class="coverage-seg ${has ? "filled" : ""}" title="${escapeHtml(t.name)}"></div>`;
    }).join("") + `</div>`;
  }

  // ---------- card rendering ----------

  function cardHtml(type, e, data) {
    const color = `var(--c-${type})`;
    switch (type) {
      case "groups": {
        const flags = e.countries.length
          ? `<div class="cflags">${e.countries.map(c => flagEmoji(c.code)).join(" ")} <span style="color:var(--text-dim); font-family:var(--font-mono); font-size:10px;">${e.countries.map(c=>c.name).join(", ")}</span></div>`
          : "";
        return `
          <button class="card" data-type="groups" data-id="${e.id}" style="--card-color:${color}">
            <div class="cid">${e.id}</div>
            <div class="cname">${escapeHtml(e.name)}</div>
            <div class="csub">${e.aliases.filter(a => a !== e.name).slice(0, 5).join(" · ") || "no known aliases"}</div>
            ${flags}
            <div class="cstats"><b>${e.techniques.length}</b> techniques · <b>${e.software.length}</b> software</div>
            ${coverageBar(data, e.techniques)}
          </button>`;
      }
      case "techniques": {
        const tacticNames = e.tactics.map(id => data.byId.tactics[id]?.name).filter(Boolean);
        return `
          <button class="card" data-type="techniques" data-id="${e.id}" style="--card-color:${color}">
            <div class="cid">${e.id}${e.is_subtechnique ? " · sub-technique" : ""}</div>
            <div class="cname">${escapeHtml(techniqueLabel(e, data))}</div>
            <div class="csub">${tacticNames.map(n => `<span class="ctag">${escapeHtml(n)}</span>`).join("") || "—"}</div>
            <div class="cstats"><b>${e.groups.length}</b> groups · <b>${e.software.length}</b> software · <b>${e.mitigations.length}</b> mitigations</div>
          </button>`;
      }
      case "tactics": {
        const count = techniquesForTactic(data, e.id).length;
        return `
          <button class="card" data-type="tactics" data-id="${e.id}" style="--card-color:${color}">
            <div class="cid">${e.id}</div>
            <div class="cname">${escapeHtml(e.name)}</div>
            <div class="csub">${escapeHtml(e.description || "")}</div>
            <div class="cstats"><b>${count}</b> techniques</div>
          </button>`;
      }
      case "software": {
        return `
          <button class="card" data-type="software" data-id="${e.id}" style="--card-color:${color}">
            <div class="cid">${e.id} <span class="ctag">${e.type}</span></div>
            <div class="cname">${escapeHtml(e.name)}</div>
            <div class="csub">${e.aliases.filter(a => a !== e.name).slice(0, 5).join(" · ") || "no known aliases"}</div>
            <div class="cstats"><b>${e.techniques.length}</b> techniques · <b>${e.campaigns.length}</b> campaigns</div>
          </button>`;
      }
      case "campaigns": {
        const span = [e.first_seen, e.last_seen].filter(Boolean).map(d => d.slice(0, 4));
        const range = span.length ? (span[0] === span[1] ? span[0] : span.join("–")) : "date unknown";
        return `
          <button class="card" data-type="campaigns" data-id="${e.id}" style="--card-color:${color}">
            <div class="cid">${e.id} · ${range}</div>
            <div class="cname">${escapeHtml(e.name)}</div>
            <div class="csub">${escapeHtml(e.description || "")}</div>
            <div class="cstats"><b>${e.groups.length}</b> groups · <b>${e.techniques.length}</b> techniques</div>
          </button>`;
      }
      case "mitigations": {
        return `
          <button class="card" data-type="mitigations" data-id="${e.id}" style="--card-color:${color}">
            <div class="cid">${e.id}</div>
            <div class="cname">${escapeHtml(e.name)}</div>
            <div class="csub">${escapeHtml(e.description || "")}</div>
            <div class="cstats">mitigates <b>${e.techniques.length}</b> techniques</div>
          </button>`;
      }
    }
    return "";
  }

  // ---------- grid / country cloud ----------

  function render() {
    if (!cache[currentDomain]) return;
    if (currentType === "groups" && groupView === "country") {
      renderCountryCloud();
    } else {
      renderGrid();
    }
  }

  function renderActiveFilter() {
    const slot = document.getElementById("active-filter-slot");
    if (currentType === "groups" && countryFilter) {
      slot.innerHTML = `<div class="active-filter" id="clear-country">${flagEmoji(countryFilter.code)} ${escapeHtml(countryFilter.name)} ✕</div>`;
      document.getElementById("clear-country").addEventListener("click", () => {
        countryFilter = null;
        render();
      });
    } else {
      slot.innerHTML = "";
    }
  }

  function renderGrid() {
    const data = cache[currentDomain];
    let list = data[currentType].slice();

    if (currentType === "groups" && countryFilter) {
      list = countryFilter.code === "__none__"
        ? list.filter(g => g.countries.length === 0)
        : list.filter(g => g.countries.some(c => c.code === countryFilter.code));
    }

    const term = searchTerm.trim();
    list = list.filter(e => matchesSearch(currentType, e, term));

    renderActiveFilter();
    document.getElementById("stat-line").textContent = `showing ${list.length} of ${data[currentType].length} ${TYPE_LABEL[currentType].toLowerCase()}`;

    const root = document.getElementById("view-root");
    if (list.length === 0) {
      root.innerHTML = `<div class="empty-state">Nothing matches${term ? ` "${escapeHtml(term)}"` : ""}.</div>`;
      return;
    }

    root.innerHTML = `<div class="grid">` + list.map(e => cardHtml(currentType, e, data)).join("") + `</div>`;
    root.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => openFlyout(card.dataset.type, card.dataset.id, { push: false, reset: true }));
    });
  }

  function renderCountryCloud() {
    const data = cache[currentDomain];
    renderActiveFilter();
    document.getElementById("stat-line").textContent = `${data.groups.length} groups, grouped by inferred country of origin`;

    const counts = {};
    let unattributed = 0;
    data.groups.forEach(g => {
      if (g.countries.length === 0) { unattributed++; return; }
      g.countries.forEach(c => {
        counts[c.code] = counts[c.code] || { name: c.name, count: 0 };
        counts[c.code].count++;
      });
    });
    const entries = Object.entries(counts).sort((a, b) => b[1].count - a[1].count);
    const max = Math.max(1, ...entries.map(([, v]) => v.count));

    const root = document.getElementById("view-root");
    root.innerHTML = `<div class="country-cloud">` +
      entries.map(([code, v]) => {
        const size = (13 + (v.count / max) * 15).toFixed(1);
        return `<button class="country-chip" data-code="${code}" data-name="${escapeHtml(v.name)}" style="font-size:${size}px">
          ${flagEmoji(code)} ${escapeHtml(v.name)} <span class="n">${v.count}</span>
        </button>`;
      }).join("") +
      (unattributed ? `<button class="country-chip unattributed" data-code="__none__" data-name="Unattributed">🏳 Unattributed <span class="n">${unattributed}</span></button>` : "") +
      `</div>`;

    root.querySelectorAll(".country-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        countryFilter = { code: chip.dataset.code, name: chip.dataset.name };
        groupView = "grid";
        syncTabsActive();
        render();
      });
    });
  }

  // ---------- flyout ----------

  function relatedSection(title, type, ids, data, opts = {}) {
    if (!ids || ids.length === 0) return "";
    const color = `var(--c-${type})`;
    const items = ids.map(id => getEntity(data, type, id)).filter(Boolean);
    const label = (e) => type === "techniques" ? techniqueLabel(e, data) : e.name;
    return `
      <div class="section-title">${escapeHtml(title)} (${items.length})</div>
      <div class="chip-row">
        ${items.map(e => `<span class="chip" style="--chip-color:${color}" data-type="${type}" data-id="${e.id}">${escapeHtml(label(e))}</span>`).join("")}
      </div>`;
  }

  function flyoutBodyHtml(type, e, data) {
    switch (type) {
      case "groups": {
        const byTactic = data.tactics.map(tactic => {
          const techs = e.techniques.map(id => data.byId.techniques[id]).filter(t => t && t.tactics.includes(tactic.id));
          return { tactic, techs };
        }).filter(g => g.techs.length > 0);

        return `
          <div class="fid" style="--card-color:var(--c-groups)">${e.id}</div>
          <h2>${escapeHtml(e.name)}</h2>
          <div class="alias-row">
            ${e.countries.map(c => `<span class="alias-chip">${flagEmoji(c.code)} ${escapeHtml(c.name)}</span>`).join("")}
            ${e.aliases.filter(a => a !== e.name).map(a => `<span class="alias-chip">${escapeHtml(a)}</span>`).join("")}
          </div>
          <p class="flyout-summary">${escapeHtml(e.description) || "No description available."}</p>
          <a class="spotlight-btn" href="spotlight.html?domain=${encodeURIComponent(currentDomain)}&group=${encodeURIComponent(e.id)}">⌁ Spotlight this actor</a>
          ${relatedSection("Campaigns", "campaigns", e.campaigns, data)}
          ${relatedSection("Software &amp; tools", "software", e.software, data)}
          <div class="section-title">Techniques by tactic (${e.techniques.length})</div>
          ${byTactic.map(({ tactic, techs }) => `
            <div class="technique-group">
              <h4>${escapeHtml(tactic.name)} <span style="color:var(--text-dim)">(${techs.length})</span></h4>
              <div class="chip-row">
                ${techs.map(t => `<span class="chip" style="--chip-color:var(--c-techniques)" data-type="techniques" data-id="${t.id}">${escapeHtml(techniqueLabel(t, data))}</span>`).join("")}
              </div>
            </div>`).join("") || `<div style="color:var(--text-dim); font-size:12px;">none recorded</div>`}
        `;
      }
      case "techniques": {
        const tacticNames = e.tactics.map(id => data.byId.tactics[id]).filter(Boolean);
        return `
          <div class="fid" style="--card-color:var(--c-techniques)">${e.id}${e.is_subtechnique ? " · sub-technique" : ""}</div>
          <h2>${escapeHtml(techniqueLabel(e, data))}</h2>
          <div class="alias-row">
            ${tacticNames.map(t => `<span class="alias-chip" data-type="tactics" data-id="${t.id}" style="cursor:pointer">${escapeHtml(t.name)}</span>`).join("")}
            ${e.platforms.map(p => `<span class="alias-chip">${escapeHtml(p)}</span>`).join("")}
          </div>
          <p class="flyout-summary">${escapeHtml(e.description) || "No description available."}</p>
          ${relatedSection("Used by groups", "groups", e.groups, data)}
          ${relatedSection("Used by software", "software", e.software, data)}
          ${relatedSection("Seen in campaigns", "campaigns", e.campaigns, data)}
          ${relatedSection("Mitigations", "mitigations", e.mitigations, data)}
        `;
      }
      case "tactics": {
        const techs = techniquesForTactic(data, e.id);
        return `
          <div class="fid" style="--card-color:var(--c-tactics)">${e.id}</div>
          <h2>${escapeHtml(e.name)}</h2>
          <p class="flyout-summary">${escapeHtml(e.description) || "No description available."}</p>
          ${relatedSection(`Techniques in this tactic`, "techniques", techs.map(t => t.id), data)}
        `;
      }
      case "software": {
        const usedBy = groupsUsingSoftware(data, e.id).map(g => g.id);
        return `
          <div class="fid" style="--card-color:var(--c-software)">${e.id} · ${e.type}</div>
          <h2>${escapeHtml(e.name)}</h2>
          <div class="alias-row">
            ${e.aliases.filter(a => a !== e.name).map(a => `<span class="alias-chip">${escapeHtml(a)}</span>`).join("")}
            ${e.platforms.map(p => `<span class="alias-chip">${escapeHtml(p)}</span>`).join("")}
          </div>
          <p class="flyout-summary">${escapeHtml(e.description) || "No description available."}</p>
          ${relatedSection("Used by groups", "groups", usedBy, data)}
          ${relatedSection("Techniques", "techniques", e.techniques, data)}
          ${relatedSection("Seen in campaigns", "campaigns", e.campaigns, data)}
        `;
      }
      case "campaigns": {
        const span = [e.first_seen, e.last_seen].filter(Boolean).map(d => d.slice(0, 10));
        return `
          <div class="fid" style="--card-color:var(--c-campaigns)">${e.id}</div>
          <h2>${escapeHtml(e.name)}</h2>
          ${span.length ? `<div class="flyout-meta">active ${span.join(" – ")}</div>` : ""}
          <p class="flyout-summary">${escapeHtml(e.description) || "No description available."}</p>
          ${relatedSection("Attributed to", "groups", e.groups, data)}
          ${relatedSection("Techniques", "techniques", e.techniques, data)}
          ${relatedSection("Software &amp; tools", "software", e.software, data)}
        `;
      }
      case "mitigations": {
        return `
          <div class="fid" style="--card-color:var(--c-mitigations)">${e.id}</div>
          <h2>${escapeHtml(e.name)}</h2>
          <p class="flyout-summary">${escapeHtml(e.description) || "No description available."}</p>
          ${relatedSection("Mitigates techniques", "techniques", e.techniques, data)}
        `;
      }
    }
    return "";
  }

  function flyoutStackLabel(hop, data) {
    const e = getEntity(data, hop.type, hop.id);
    if (!e) return hop.id;
    return hop.type === "techniques" ? techniqueLabel(e, data) : e.name;
  }

  function renderFlyoutCrumbs() {
    const data = cache[currentDomain];
    const el = document.getElementById("flyout-crumbs");
    el.innerHTML = flyoutStack.map((hop, i) => {
      const isLast = i === flyoutStack.length - 1;
      const label = escapeHtml(flyoutStackLabel(hop, data));
      return (i > 0 ? `<span class="sep">›</span>` : "") + `<button data-i="${i}" ${isLast ? "disabled" : ""}>${label}</button>`;
    }).join("");
    el.querySelectorAll("button:not([disabled])").forEach(b => {
      b.addEventListener("click", () => {
        const i = Number(b.dataset.i);
        const hop = flyoutStack[i];
        flyoutStack = flyoutStack.slice(0, i + 1);
        openFlyout(hop.type, hop.id, { push: false });
      });
    });
    el.scrollLeft = el.scrollWidth;
  }

  function openFlyout(type, id, opts = {}) {
    const data = cache[currentDomain];
    const entity = getEntity(data, type, id);
    if (!entity) return;

    if (opts.reset) {
      flyoutStack = [{ type, id }];
    } else if (opts.push !== false) {
      flyoutStack.push({ type, id });
    }
    // else: opts.push === false and not resetting — caller already put the
    // stack in the right shape (e.g. flyoutBack popped it), just re-render.

    document.getElementById("flyout-body").innerHTML = flyoutBodyHtml(type, entity, data);
    document.getElementById("flyout-back").disabled = flyoutStack.length <= 1;
    renderFlyoutCrumbs();
    document.getElementById("flyout").classList.add("open");
    document.getElementById("flyout-backdrop").classList.add("open");

    document.getElementById("flyout-body").querySelectorAll("[data-type][data-id]").forEach(el => {
      el.addEventListener("click", () => openFlyout(el.dataset.type, el.dataset.id));
    });

    document.getElementById("flyout-body").scrollTop = 0;
  }

  function flyoutBack() {
    if (flyoutStack.length <= 1) return;
    flyoutStack.pop();
    const prev = flyoutStack[flyoutStack.length - 1];
    openFlyout(prev.type, prev.id, { push: false });
  }

  function closeFlyout() {
    flyoutStack = [];
    document.getElementById("flyout").classList.remove("open");
    document.getElementById("flyout-backdrop").classList.remove("open");
  }

  document.getElementById("flyout-back").addEventListener("click", flyoutBack);
  document.getElementById("flyout-close").addEventListener("click", closeFlyout);
  document.getElementById("flyout-backdrop").addEventListener("click", closeFlyout);

  // ---------- wiring ----------

  document.querySelectorAll(".domain-btn").forEach(btn => {
    btn.addEventListener("click", () => { if (btn.dataset.domain !== currentDomain) switchDomain(btn.dataset.domain); });
  });

  document.querySelectorAll("#group-view-toggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      groupView = btn.dataset.view;
      countryFilter = null;
      syncTabsActive();
      render();
    });
  });

  document.getElementById("search-input").addEventListener("input", (e) => {
    searchTerm = e.target.value;
    if (groupView !== "country" || currentType !== "groups") render();
  });

  document.getElementById("reset-btn").addEventListener("click", () => {
    searchTerm = "";
    countryFilter = null;
    groupView = "grid";
    document.getElementById("search-input").value = "";
    syncTabsActive();
    render();
    window.scrollTo({ top: 0, behavior: REDUCED_MOTION ? "auto" : "smooth" });
  });

  renderTabs();
  switchDomain(currentDomain);
})();
</script>
</body>
</html>
