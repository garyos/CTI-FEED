<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — ATT&amp;CK Explorer</title>
<style>
  :root {
    --ink: #0a0e14;
    --ink-raised: #10151d;
    --ink-input: #0d1219;
    --line: #1e2733;
    --text: #d7dde5;
    --text-dim: #7d8998;
    --amber: #ffb020;
    --red: #ff5c5c;
    --blue: #5ac8ff;
    --green: #4fd58a;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans: "Space Grotesk", "Inter", system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .frame {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  header.masthead {
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }

  .masthead h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }

  .masthead .sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  .masthead nav a {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-dim);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 6px 10px;
  }
  .masthead nav a:hover { color: var(--amber); border-color: var(--amber); }

  /* domain switcher */
  .domain-switcher {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .domain-btn {
    background: var(--ink-raised);
    color: var(--text-dim);
    border: none;
    font-family: var(--font-mono);
    font-size: 12.5px;
    letter-spacing: 0.04em;
    padding: 12px 6px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .domain-btn.active { background: var(--ink); color: var(--amber); font-weight: 600; }
  .domain-btn:disabled { opacity: 0.4; cursor: wait; }

  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }
  .toolbar input {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 12.5px;
    padding: 10px 12px;
    background: var(--ink-input);
    color: var(--text);
    border: 1px solid var(--line);
  }
  .toolbar input::placeholder { color: var(--text-dim); }
  .reset-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    background: none;
    border: 1px solid var(--line);
    padding: 10px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .reset-btn:hover { color: var(--amber); border-color: var(--amber); }

  .stat-line {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin: 10px 0 16px;
  }

  /* group grid */
  .group-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 620px) {
    .group-grid { grid-template-columns: 1fr 1fr; }
  }

  .group-card {
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: var(--font-sans);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .group-card:hover, .group-card:focus-visible { background: #141b26; }

  .group-card .gid {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .group-card .gname { font-size: 15px; font-weight: 600; margin: 3px 0 5px; }
  .group-card .galiases {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.4;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .group-card .gcounts {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .group-card .gcounts b { color: var(--text); }

  .coverage-bar { display: flex; gap: 2px; height: 5px; }
  .coverage-seg { flex: 1; background: rgba(255,255,255,0.08); }
  .coverage-seg.filled { background: var(--amber); }

  .empty-state {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
    padding: 40px 0;
    text-align: center;
    border: 1px dashed var(--line);
  }

  /* detail view */
  .detail-back {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0 0 14px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .detail-back:hover { color: var(--amber); }

  .detail-head { margin-bottom: 16px; }
  .detail-head .gid { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
  .detail-head h2 { font-size: 22px; margin: 4px 0 8px; }
  .alias-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .alias-chip {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 3px 8px;
  }
  .detail-summary { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); margin-bottom: 18px; }

  .section-title {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 22px 0 10px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .tactic-coverage { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
  .tactic-row { display: grid; grid-template-columns: 1fr 26px; align-items: center; gap: 8px; }
  .tactic-row .tname {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tactic-row.has .tname { color: var(--text); }
  .tactic-row .ttrack { height: 5px; background: rgba(255,255,255,0.06); position: relative; margin-top: 2px; }
  .tactic-row .tfill { height: 100%; background: var(--blue); }
  .tactic-row .tcount { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-align: right; }

  .technique-group { margin-bottom: 14px; }
  .technique-group h4 {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--blue);
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px;
    padding: 5px 10px;
    background: var(--ink-input);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .chip.software {
    cursor: pointer;
    border-color: var(--amber);
    color: var(--amber);
  }
  .chip.software:hover, .chip.software.open { background: rgba(255,176,32,0.12); }

  .related-actors {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    padding: 8px 10px;
    background: var(--ink-input);
    border-left: 2px solid var(--amber);
    margin: -2px 0 8px;
  }
  .related-actors a { color: var(--text); text-decoration: none; }
  .related-actors a:hover { color: var(--amber); text-decoration: underline; }

  footer {
    margin-top: 32px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  a.footer-link { color: var(--text-dim); }
  a.footer-link:hover { color: var(--amber); }

  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="frame">
    <header class="masthead">
      <div>
        <h1>ATT&amp;CK EXPLORER</h1>
        <div class="sub" id="domain-line">loading…</div>
      </div>
      <nav><a href="index.html">‹ feed</a></nav>
    </header>

    <div class="domain-switcher" id="domain-switcher">
      <button class="domain-btn" data-domain="enterprise">Enterprise</button>
      <button class="domain-btn" data-domain="mobile">Mobile</button>
      <button class="domain-btn" data-domain="ics">ICS</button>
    </div>

    <div class="toolbar">
      <input id="search-input" type="text" placeholder="search actor name or alias…" />
      <button class="reset-btn" id="reset-btn">reset</button>
    </div>
    <div class="stat-line" id="stat-line"></div>

    <div id="view-root">
      <div class="empty-state">Loading ATT&amp;CK data…</div>
    </div>

    <footer>
      MITRE ATT&amp;CK® data compacted from
      <a class="footer-link" href="https://github.com/mitre-attack/attack-stix-data" target="_blank" rel="noopener noreferrer">mitre-attack/attack-stix-data</a>
      by a scheduled GitHub Action · <a class="footer-link" href="data/attack/enterprise.json">view raw enterprise data</a>
    </footer>
  </div>

  <script>
    const DOMAINS = ["enterprise", "mobile", "ics"];
    const STORAGE_KEY = "signal-attack-domain-v1";

    const cache = {};           // domain -> parsed data
    let currentDomain = localStorage.getItem(STORAGE_KEY) || "enterprise";
    if (!DOMAINS.includes(currentDomain)) currentDomain = "enterprise";
    let selectedGroupId = null;
    let searchTerm = "";
    let openSoftwareChip = null;

    async function loadDomain(domain) {
      if (cache[domain]) return cache[domain];
      const res = await fetch(`data/attack/${domain}.json?t=${Date.now()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      data.techniquesById = Object.fromEntries(data.techniques.map(t => [t.id, t]));
      data.groupsById = Object.fromEntries(data.groups.map(g => [g.id, g]));
      data.softwareById = Object.fromEntries(data.software.map(s => [s.id, s]));
      data.tacticsById = Object.fromEntries(data.tactics.map(t => [t.id, t]));
      cache[domain] = data;
      return data;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    async function switchDomain(domain) {
      currentDomain = domain;
      selectedGroupId = null;
      openSoftwareChip = null;
      localStorage.setItem(STORAGE_KEY, domain);
      document.querySelectorAll(".domain-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.domain === domain);
        b.disabled = true;
      });
      document.getElementById("view-root").innerHTML = `<div class="empty-state">Loading ${escapeHtml(domain)} data…</div>`;
      try {
        const data = await loadDomain(domain);
        document.querySelectorAll(".domain-btn").forEach(b => b.disabled = false);
        document.getElementById("domain-line").textContent =
          `${data.name} · ${data.groups.length} groups · ${data.software.length} software · ${data.techniques.length} techniques · fetched ${new Date(data.fetched_at).toLocaleDateString()}`;
        render();
      } catch (err) {
        document.querySelectorAll(".domain-btn").forEach(b => b.disabled = false);
        document.getElementById("view-root").innerHTML =
          `<div class="empty-state">Couldn't load ${escapeHtml(domain)} data. Has scripts/fetch_attack.py been run yet?</div>`;
        console.error(err);
      }
    }

    function coverageBar(data, group, size) {
      return `<div class="coverage-bar">` + data.tactics.map(t => {
        const has = group.techniques.some(tid => (data.techniquesById[tid]?.tactics || []).includes(t.id));
        return `<div class="coverage-seg ${has ? "filled" : ""}" title="${escapeHtml(t.name)}"></div>`;
      }).join("") + `</div>`;
    }

    function render() {
      const data = cache[currentDomain];
      if (!data) return;
      if (selectedGroupId) {
        renderDetail(data, data.groupsById[selectedGroupId]);
      } else {
        renderGrid(data);
      }
    }

    function renderGrid(data) {
      const term = searchTerm.trim().toLowerCase();
      const groups = data.groups.filter(g => {
        if (!term) return true;
        return g.name.toLowerCase().includes(term) || g.aliases.some(a => a.toLowerCase().includes(term));
      });

      document.getElementById("stat-line").textContent = `showing ${groups.length} of ${data.groups.length} groups`;

      if (groups.length === 0) {
        document.getElementById("view-root").innerHTML = `<div class="empty-state">No actors match "${escapeHtml(searchTerm)}".</div>`;
        return;
      }

      const root = document.getElementById("view-root");
      root.innerHTML = `<div class="group-grid">` + groups.map(g => `
        <button class="group-card" data-gid="${g.id}">
          <div class="gid">${g.id}</div>
          <div class="gname">${escapeHtml(g.name)}</div>
          <div class="galiases">${g.aliases.filter(a => a !== g.name).slice(0, 5).join(" · ") || "no known aliases"}</div>
          <div class="gcounts"><b>${g.techniques.length}</b> techniques · <b>${g.software.length}</b> software</div>
          ${coverageBar(data, g)}
        </button>
      `).join("") + `</div>`;

      root.querySelectorAll(".group-card").forEach(card => {
        card.addEventListener("click", () => {
          selectedGroupId = card.dataset.gid;
          openSoftwareChip = null;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function renderDetail(data, group) {
      document.getElementById("stat-line").textContent = "";

      const techniquesByTactic = data.tactics.map(tactic => {
        const techs = group.techniques
          .map(tid => data.techniquesById[tid])
          .filter(t => t && t.tactics.includes(tactic.id));
        return { tactic, techs };
      }).filter(g => g.techs.length > 0);

      const softwareHtml = group.software.map(sid => {
        const sw = data.softwareById[sid];
        if (!sw) return "";
        return `<span class="chip software" data-sid="${sid}">${escapeHtml(sw.name)}</span>`;
      }).join("");

      const techniqueGroupsHtml = techniquesByTactic.map(({ tactic, techs }) => `
        <div class="technique-group">
          <h4>${escapeHtml(tactic.name)} <span style="color:var(--text-dim)">(${techs.length})</span></h4>
          <div class="chip-row">
            ${techs.map(t => {
              const label = t.parent && data.techniquesById[t.parent]
                ? `${data.techniquesById[t.parent].name}: ${t.name}`
                : t.name;
              return `<span class="chip" title="${t.id}">${escapeHtml(label)}</span>`;
            }).join("")}
          </div>
        </div>
      `).join("");

      document.getElementById("view-root").innerHTML = `
        <button class="detail-back" id="back-btn">‹ all ${escapeHtml(currentDomain)} actors</button>
        <div class="detail-head">
          <div class="gid">${group.id}</div>
          <h2>${escapeHtml(group.name)}</h2>
          <div class="alias-row">
            ${group.aliases.filter(a => a !== group.name).map(a => `<span class="alias-chip">${escapeHtml(a)}</span>`).join("") || ""}
          </div>
          <p class="detail-summary">${escapeHtml(group.summary) || "No summary available."}</p>
        </div>

        <div class="section-title">Tactic coverage — ${group.techniques.length} techniques across ${techniquesByTactic.length} of ${data.tactics.length} tactics</div>
        <div class="tactic-coverage">
          ${data.tactics.map(t => {
            const count = group.techniques.filter(tid => (data.techniquesById[tid]?.tactics || []).includes(t.id)).length;
            const max = Math.max(1, ...data.tactics.map(tt => group.techniques.filter(tid => (data.techniquesById[tid]?.tactics || []).includes(tt.id)).length));
            return `
              <div class="tactic-row ${count > 0 ? "has" : ""}">
                <div>
                  <div class="tname">${escapeHtml(t.name)}</div>
                  <div class="ttrack"><div class="tfill" style="width:${count ? (count/max*100).toFixed(0) : 0}%"></div></div>
                </div>
                <div class="tcount">${count || "—"}</div>
              </div>`;
          }).join("")}
        </div>

        <div class="section-title">Software &amp; tools (${group.software.length}) — tap to see who else uses it</div>
        <div class="chip-row">${softwareHtml || `<span style="color:var(--text-dim); font-size:12px;">none recorded</span>`}</div>
        <div id="related-actors-slot"></div>

        <div class="section-title">Techniques by tactic</div>
        ${techniqueGroupsHtml || `<div style="color:var(--text-dim); font-size:12px;">none recorded</div>`}
      `;

      document.getElementById("back-btn").addEventListener("click", () => {
        selectedGroupId = null;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.querySelectorAll(".chip.software").forEach(chip => {
        chip.addEventListener("click", () => {
          const sid = chip.dataset.sid;
          openSoftwareChip = openSoftwareChip === sid ? null : sid;
          document.querySelectorAll(".chip.software").forEach(c => c.classList.toggle("open", c.dataset.sid === openSoftwareChip));
          renderRelatedActors(data, group);
        });
      });

      renderRelatedActors(data, group);
    }

    function renderRelatedActors(data, currentGroup) {
      const slot = document.getElementById("related-actors-slot");
      if (!openSoftwareChip) { slot.innerHTML = ""; return; }
      const sw = data.softwareById[openSoftwareChip];
      const others = data.groups.filter(g => g.id !== currentGroup.id && g.software.includes(openSoftwareChip));
      if (others.length === 0) {
        slot.innerHTML = `<div class="related-actors">No other tracked actors are linked to ${escapeHtml(sw.name)}.</div>`;
        return;
      }
      slot.innerHTML = `<div class="related-actors">${escapeHtml(sw.name)} also used by: ` +
        others.map(g => `<a href="#" data-gid="${g.id}">${escapeHtml(g.name)}</a>`).join(", ") + `</div>`;
      slot.querySelectorAll("a").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          selectedGroupId = a.dataset.gid;
          openSoftwareChip = null;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    document.querySelectorAll(".domain-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.domain !== currentDomain) switchDomain(btn.dataset.domain);
      });
    });

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchTerm = e.target.value;
      if (!selectedGroupId) render();
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      searchTerm = "";
      selectedGroupId = null;
      openSoftwareChip = null;
      document.getElementById("search-input").value = "";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    switchDomain(currentDomain);
  </script>
</body>
</html>
