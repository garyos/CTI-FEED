name: Fetch Breach Tracker Data

on:
  schedule:
    # HIBP's breach list is small (~1000 entries) and cheap to poll — daily
    # is more than enough since new breaches are added irregularly, not
    # continuously.
    - cron: "8 7 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/fetch_breaches.py"   # re-run once when the extraction logic changes

permissions:
  contents: write         # needed so the workflow can commit data/breaches/*.json back

concurrency:
  group: fetch-breaches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull breach data
        run: python scripts/fetch_breaches.py

      - name: Commit updated breach data
        run: |
          git config user.name "cti-feed-bot"
          git config user.email "actions@github.com"
          git add data/breaches
          if git diff --cached --quiet; then
            echo "No breach data changes, nothing to commit."
          else
            git commit -m "Update breach tracker data [skip ci]"
            git pull --rebase origin main
            git push
          fi
