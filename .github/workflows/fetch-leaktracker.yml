name: Fetch Leak-Site Tracker Data

on:
  schedule:
    # Victims are event data and refresh daily; groups.json self-throttles to
    # roughly weekly inside the script regardless of how often this runs.
    - cron: "52 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/fetch_leaktracker.py"   # re-run once when the extraction logic changes

permissions:
  contents: write         # needed so the workflow can commit data/leaktracker/*.json back

concurrency:
  group: fetch-leaktracker
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull leak-site group/victim data
        run: python scripts/fetch_leaktracker.py

      - name: Commit updated leak-site tracker data
        run: |
          git config user.name "cti-feed-bot"
          git config user.email "actions@github.com"
          git add data/leaktracker
          if git diff --cached --quiet; then
            echo "No leak-site tracker data changes, nothing to commit."
          else
            git commit -m "Update leak-site tracker data [skip ci]"
            git pull --rebase origin main
            git push
          fi
