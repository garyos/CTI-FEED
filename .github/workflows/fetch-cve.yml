name: Fetch CVE Data

on:
  schedule:
    # CVE data changes constantly (unlike ATT&CK's weekly cadence) — once a
    # day is enough to stay current without hammering the NVD API.
    - cron: "37 5 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/fetch_cve.py"   # re-run once when the extraction logic changes

permissions:
  contents: write         # needed so the workflow can commit data/cve/*.json back

concurrency:
  group: fetch-cve
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull new/changed CVE data
        run: python scripts/fetch_cve.py

      - name: Commit updated CVE data
        run: |
          git config user.name "cti-feed-bot"
          git config user.email "actions@github.com"
          git add data/cve/*.json
          if git diff --cached --quiet; then
            echo "No CVE changes, nothing to commit."
          else
            git commit -m "Update CVE data [skip ci]"
            git pull --rebase origin main
            git push
          fi
