name: Fetch MITRE ATT&CK Data

on:
  schedule:
    # ATT&CK is revised a handful of times a year, not continuously — a
    # weekly check is plenty and keeps this off the fast news-feed cadence.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/fetch_attack.py"   # re-run once when the extraction logic changes

permissions:
  contents: write         # needed so the workflow can commit data/attack/*.json back

concurrency:
  group: fetch-attack
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest MITRE ATT&CK bundles
        run: python scripts/fetch_attack.py

      - name: Commit updated ATT&CK data
        run: |
          git config user.name "cti-feed-bot"
          git config user.email "actions@github.com"
          git add data/attack/*.json
          if git diff --cached --quiet; then
            echo "No ATT&CK changes, nothing to commit."
          else
            git commit -m "Update MITRE ATT&CK data [skip ci]"
            git pull --rebase origin main
            git push
          fi
